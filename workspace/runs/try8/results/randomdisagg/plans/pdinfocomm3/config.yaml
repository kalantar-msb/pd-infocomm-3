      pullPolicy: Always
      registry: ghcr.io/kalantar
      repository: llm-d-router
      tag: cee8bb60cbc3-randomdisagg
    pluginsConfigFile: custom-plugins.yaml
    pluginsCustomConfig:
      custom-plugins.yaml: "apiVersion: llm-d.ai/v1alpha1\nkind: EndpointPickerConfig\n\
        plugins:\n# --- Producers: identical to the baseline ------------------------------\n\
        # Retained even though this arm reads NEITHER of them. The tokenizer\n# sidecar\
        \ and the prefix producer feed prefix-cache-scorer, which still\n# selects\
        \ pods. Dropping them would change pod selection and confound the\n# comparison.\
        \ The arm's own decision consumes no producer output.\n- type: token-producer\n\
        \  parameters:\n    modelName: meta-llama/Llama-3.3-70B-Instruct\n    vllm:\n\
        \      url: \"http://localhost:8000\"\n- type: approx-prefix-cache-producer\n\
        \n# --- The decider: THE ONLY DIFFERENCE FROM THE BASELINE ----------------\n\
        - type: random-pd-decider\n  parameters:\n    # p -- the expected fraction\
        \ of requests disaggregated.\n    #\n    # 0.075 IS THE MATCHED RATE FOR interactive-chat\
        \ ONLY. It is the\n    # focal arm's OWN realized rate in the single cell\
        \ of run `try2`\n    # that completed: 41 prefill selections over 546 handled\
        \ requests\n    # (results/causalsloexternality/interactive-chat-single-turn/i1\
        \ --\n    # EPP `Request handled` count against prefill POST /v1/completions).\n\
        \    #\n    # THE MATCHED RATE IS PER WORKLOAD. The focal arm's realized rate\
        \ is\n    # a function of the prompt-length distribution, and reasoning and\n\
        \    # deep-research differ from interactive-chat. Re-measure the focal\n\
        \    # arm's rate for the target workload and set p to it, then run ONE\n\
        \    # ASSEMBLE PER WORKLOAD -- the same discipline `activeWorkload`\n   \
        \ # already forces on the focal arm (config.md S6). Reusing 0.075\n    # across\
        \ workloads produces a rate-mismatched comparison that still\n    # reports\
        \ goodput, which is the failure mode S6 warns about.\n    #\n    # For a sweep\
        \ rather than a matched-rate test, vary p across\n    # assembles: 0 reproduces\
        \ the simulator's `never` rule and 1 its\n    # `always` rule (inference-sim\
        \ sim/disaggregation.go:70-74), so the\n    # sweep spans decode-only to always-disaggregated\
        \ with the endpoints\n    # anchored to rules the simulator already defines.\n\
        \    disaggregateProbability: 0.075\n\n    # Selects WHICH subset is disaggregated\
        \ at that rate. Changing it at\n    # fixed p draws an independent subset\
        \ without changing the arm --\n    # that is how to get replicate subsets.\
        \ 42 matches the workload seed\n    # convention (workloads/*.yaml `seed:\
        \ 42`); the two are unrelated\n    # mechanically, and the shared value is\
        \ a readability choice only.\n    seed: 42\n\n    # Header whose value keys\
        \ the decision. EMPTY ON PURPOSE: no header\n    # is currently known to be\
        \ stable per request across runs, so the\n    # plugin falls back to scheduling.InferenceRequest.RequestID,\
        \ which\n    # llm-d-router documents as Envoy-generated and therefore fresh\
        \ every\n    # run. Consequence (R2): the arm is still exactly Bernoulli at\
        \ rate\n    # p and every comparison stays valid, but two runs of one workload\n\
        \    # disaggregate DIFFERENT requests, so results are not bit-replayable.\n\
        \    # Set this to a load-generator-stable header to recover replay, and\n\
        \    # record which path was used when reporting.\n    identityHeader: \"\"\
        \n\n- type: disagg-profile-handler\n  parameters:\n    deciders:\n      prefill:\
        \ random-pd-decider\n\n# --- Role filters and load-shaped scorers: identical\
        \ to the baseline ---\n# Pod selection is UNCHANGED and remains load-aware.\
        \ This is what makes\n# the arm a control on the disaggregation decision rather\
        \ than a null\n# model of the whole scheduler.\n- type: prefill-filter\n-\
        \ type: decode-filter\n- type: prefix-cache-scorer\n  parameters:\n    prefixMatchInfoProducerName:\
        \ approx-prefix-cache-producer\n- type: queue-scorer\n- type: kv-cache-utilization-scorer\n\
        - type: active-request-scorer\n\n# --- Scheduling profiles: identical to the\
        \ baseline, weights included --\nschedulingProfiles:\n- name: decode\n  plugins:\n\
        \  - pluginRef: decode-filter\n  - pluginRef: active-request-scorer\n    weight:\
        \ 2\n  - pluginRef: prefix-cache-scorer\n    weight: 3\n- name: prefill\n\
        \  plugins:\n  - pluginRef: prefill-filter\n  - pluginRef: prefix-cache-scorer\n\
        \    weight: 3\n  - pluginRef: queue-scorer\n    weight: 2\n  - pluginRef:\
        \ kv-cache-utilization-scorer\n    weight: 2\n"
    replicas: 1
    volumeMounts: []
    volumes: []
