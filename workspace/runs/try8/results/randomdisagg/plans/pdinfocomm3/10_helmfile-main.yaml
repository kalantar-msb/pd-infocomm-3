releases:

  - name: meta-lla-888e33f1-instruct-ms
    namespace: kalantar-0
    chart: llm-d-modelservice/llm-d-modelservice
    version: v0.4.16
    installed: true
    needs:
      - kalantar-0/meta-lla-888e33f1-instruct-router
    values:
      - ms-values.yaml
    labels:
      kind: inference-stack

  - name: meta-lla-888e33f1-instruct-router
    namespace: kalantar-0
    chart: oci://ghcr.io/llm-d/charts/llm-d-router-standalone
    version: v0.10.0
    installed: true
