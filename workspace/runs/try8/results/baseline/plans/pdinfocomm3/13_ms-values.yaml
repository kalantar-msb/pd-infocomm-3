fullnameOverride: meta-lla-888e33f1-instruct


schedulerName: default-scheduler

modelArtifacts:
  name: meta-llama/Llama-3.3-70B-Instruct
  uri: pvc://model-pvc/models/meta-llama/Llama-3.3-70B-Instruct
  size: 1Ti
  authSecretName: "hf-secret"
  mountPath: /model-cache
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: meta-lla-888e33f1-instruct
    llm-d.ai/guide: "scenario"
    pd-infocomm.io/gpu-type: "H100_SXM_80GB"

multinode: false

accelerator:
  type: nvidia

  dra: false


routing:
  servicePort: 8000
  proxy:
    enabled: true
    image: "ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0"
    imagePullPolicy: Always
    targetPort: 8200
    connector: nixlv2
    secure: false
    zapEncoder: json
    zapLogLevel: debug
    resources:
      limits:
        cpu: '8'
        memory: 16Gi
      requests:
        cpu: '4'
        memory: 8Gi
    debugLevel: 3


decode:
  create: true
  replicas: 2

  autoscaling:
    enabled: false




  acceleratorTypes:
    labelKey: kubernetes.io/hostname
    labelValues:
    - "pokprod-b93r38s0"
    - "pokprod-b93r38s2"
    - "pokprod-b93r38s3"
    - "pokprod-b93r39s0"
    - "pokprod-b93r39s1"
    - "pokprod-b93r39s2"
    - "pokprod-b93r43s0"
    - "pokprod-b93r43s1"
    - "pokprod-b93r43s2"
    - "pokprod-b93r43s3"
    - "pokprod-b93r44s0"
    - "pokprod-b93r44s1"
    - "pokprod-b93r44s2"

  parallelism:
    tensor: 4
    data: 1
    dataLocal: 1
    workers: 1



  podAnnotations:
    k8s.v1.cni.cncf.io/networks: "openshift-sriov-network-operator/multi-nic-compute"







  initContainers:
    - name: preprocess
      image: ghcr.io/llm-d/llm-d-benchmark:v0.7.9
      imagePullPolicy: Always
      command:
      - set_llmdbench_environment.py
      - -e
      - /shared-config/llmdbench_env.sh
      - -i
      env:
      - name: VLLM_IS_DECODE
        value: "1"
      - name: HOME
        value: "/tmp"
      - name: USER
        value: "llm-d"
      - name: HF_HOME
        value: "/tmp/huggingface"
      - name: MODEL_NAME
        value: "meta-llama/Llama-3.3-70B-Instruct"
      - name: MODEL_PATH
        value: "models/meta-llama/Llama-3.3-70B-Instruct"
      - name: VLLM_CACHE_ROOT
        value: "/tmp/vllm"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_LOGGING_LEVEL
        value: "INFO"
      - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
        value: "120"
      - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
        value: "1"
      - name: VLLM_SERVER_DEV_MODE
        value: "1"
      - name: VLLM_INFERENCE_PORT
        value: "8000"
      - name: VLLM_METRICS_PORT
        value: "8200"
      - name: VLLM_BLOCK_SIZE
        value: "16"
      - name: VLLM_MAX_MODEL_LEN
        value: "131072"
      - name: VLLM_LOAD_FORMAT
        value: "auto"
      - name: VLLM_ACCELERATOR_MEM_UTIL
        value: "0.9"
      - name: VLLM_MAX_NUM_SEQ
        value: "256"
      - name: VLLM_TENSOR_PARALLELISM
        value: "4"
      - name: VLLM_MAX_NUM_BATCHED_TOKENS
        value: "256"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: UCX_TLS
        value: "rc,sm,cuda_ipc,cuda_copy"
      - name: UCX_SOCKADDR_TLS_PRIORITY
        value: "tcp"
      - name: POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: LLMDBENCH_POD_NS
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: UCX_LOG_LEVEL
        value: "info"
      - name: UCX_PROTO_INFO
        value: "y"
      - name: NIXL_LOG_LEVEL
        value: "debug"
      - name: NCCL_DEBUG
        value: "INFO"
      - name: NVSHMEM_DEBUG
        value: "INFO"

      volumeMounts:
      - mountPath: /shared-config
        name: shared-config


  containers:
  - name: "vllm"
    image: "docker.io/vllm/vllm-openai:v0.26.0"
    imagePullPolicy: IfNotPresent
    mountModelVolume: true
    modelCommand: custom
    command:
      - /bin/bash
      - '-c'
    args:
      - |
        export LD_LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | sed ':a; N; $!ba; s/\n/:/g'):${LD_LIBRARY_PATH}; export LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | head -1):${LIBRARY_PATH}; . /shared-config/llmdbench_env.sh ; vllm serve /model-cache/models/meta-llama/Llama-3.3-70B-Instruct \
          --host 0.0.0.0 \
          --served-model-name meta-llama/Llama-3.3-70B-Instruct \
          --port $VLLM_METRICS_PORT \
          --block-size $VLLM_BLOCK_SIZE \
          --max-model-len $VLLM_MAX_MODEL_LEN \
          --tensor-parallel-size $VLLM_TENSOR_PARALLELISM \
          --gpu-memory-utilization $VLLM_ACCELERATOR_MEM_UTIL \
          --no-enable-log-requests \
          --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
          --max-num-seqs=256 \
          --max-num-batched-tokens=32768 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --enable-force-include-usage
    env:
      - name: VLLM_IS_DECODE
        value: "1"
      - name: HOME
        value: "/tmp"
      - name: USER
        value: "llm-d"
      - name: HF_HOME
        value: "/tmp/huggingface"
      - name: MODEL_NAME
        value: "meta-llama/Llama-3.3-70B-Instruct"
      - name: MODEL_PATH
        value: "models/meta-llama/Llama-3.3-70B-Instruct"
      - name: VLLM_CACHE_ROOT
        value: "/tmp/vllm"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_LOGGING_LEVEL
        value: "INFO"
      - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
        value: "120"
      - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
        value: "1"
      - name: VLLM_SERVER_DEV_MODE
        value: "1"
      - name: VLLM_INFERENCE_PORT
        value: "8000"
      - name: VLLM_METRICS_PORT
        value: "8200"
      - name: VLLM_BLOCK_SIZE
        value: "16"
      - name: VLLM_MAX_MODEL_LEN
        value: "131072"
      - name: VLLM_LOAD_FORMAT
        value: "auto"
      - name: VLLM_ACCELERATOR_MEM_UTIL
        value: "0.9"
      - name: VLLM_MAX_NUM_SEQ
        value: "256"
      - name: VLLM_TENSOR_PARALLELISM
        value: "4"
      - name: VLLM_MAX_NUM_BATCHED_TOKENS
        value: "256"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: UCX_TLS
        value: "rc,sm,cuda_ipc,cuda_copy"
      - name: UCX_SOCKADDR_TLS_PRIORITY
        value: "tcp"
      - name: POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: LLMDBENCH_POD_NS
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: UCX_LOG_LEVEL
        value: "info"
      - name: UCX_PROTO_INFO
        value: "y"
      - name: NIXL_LOG_LEVEL
        value: "debug"
      - name: NCCL_DEBUG
        value: "INFO"
      - name: NVSHMEM_DEBUG
        value: "INFO"

    resources:
      limits:
        memory: 128Gi
        cpu: "32"
        nvidia.com/gpu: "4"
        rdma/roce_gdr: "1"
      requests:
        memory: 64Gi
        cpu: "16"
        nvidia.com/gpu: "4"
        rdma/roce_gdr: "1"
    extraConfig:
      startupProbe:
        httpGet:
          path: /health
          port: 8200
        failureThreshold: 60
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 8200
        failureThreshold: 10
        periodSeconds: 5
        timeoutSeconds: 15
      readinessProbe:
        httpGet:
          path: /health
          port: 8200
        failureThreshold: 10
        periodSeconds: 5
        timeoutSeconds: 15
      securityContext:
        capabilities:
          add:
          - IPC_LOCK
          - SYS_RAWIO
          - NET_ADMIN
          - NET_RAW
        runAsGroup: 0
        runAsUser: 0
    volumeMounts:
      - name: shared-config
        mountPath: /shared-config
      - name: dshm
        mountPath: /dev/shm

  volumes:
    - name: shared-config
      emptyDir: {}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi

  monitoring:
    podmonitor:
      enabled: false

