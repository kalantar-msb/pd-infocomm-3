apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: baseline-deep-research-single-turn-try8-i1
  namespace: kalantar-0
spec:
  params:
  - name: experimentId
    value: try8
  - name: runName
    value: try8
  - name: namespace
    value: kalantar-0
  - name: phase
    value: baseline
  - name: scenarioContent
    value: "scenario:\n- annotations:\n    decode:\n      pod:\n        k8s.v1.cni.cncf.io/networks:\
      \ openshift-sriov-network-operator/multi-nic-compute\n    prefill:\n      pod:\n\
      \        k8s.v1.cni.cncf.io/networks: openshift-sriov-network-operator/multi-nic-compute\n\
      \  decode:\n    acceleratorType:\n      labelKey: kubernetes.io/hostname\n \
      \     labelValue: ''\n      labelValues:\n      - pokprod-b93r38s0\n      -\
      \ pokprod-b93r38s2\n      - pokprod-b93r38s3\n      - pokprod-b93r39s0\n   \
      \   - pokprod-b93r39s1\n      - pokprod-b93r39s2\n      - pokprod-b93r43s0\n\
      \      - pokprod-b93r43s1\n      - pokprod-b93r43s2\n      - pokprod-b93r43s3\n\
      \      - pokprod-b93r44s0\n      - pokprod-b93r44s1\n      - pokprod-b93r44s2\n\
      \    extraContainerConfig:\n      securityContext:\n        capabilities:\n\
      \          add:\n          - IPC_LOCK\n          - SYS_RAWIO\n          - NET_ADMIN\n\
      \          - NET_RAW\n        runAsGroup: 0\n        runAsUser: 0\n    extraEnvVars:\n\
      \    - name: UCX_LOG_LEVEL\n      value: info\n    - name: UCX_PROTO_INFO\n\
      \      value: y\n    - name: NIXL_LOG_LEVEL\n      value: debug\n    - name:\
      \ NCCL_DEBUG\n      value: INFO\n    - name: NVSHMEM_DEBUG\n      value: INFO\n\
      \    initContainers:\n    - command:\n      - set_llmdbench_environment.py\n\
      \      - -e\n      - /shared-config/llmdbench_env.sh\n      - -i\n      imageKey:\
      \ benchmark\n      imagePullPolicy: Always\n      name: preprocess\n      volumeMounts:\n\
      \      - mountPath: /shared-config\n        name: shared-config\n    parallelism:\n\
      \      data: 1\n      dataLocal: 1\n      tensor: 4\n      workers: 1\n    replicas:\
      \ 2\n    resources:\n      limits:\n        cpu: '32'\n        memory: 128Gi\n\
      \      requests:\n        cpu: '16'\n        memory: 64Gi\n    vllm:\n     \
      \ additionalFlags:\n      - --max-num-seqs=256\n      - --max-num-batched-tokens=32768\n\
      \      - --enable-chunked-prefill\n      - --enable-prefix-caching\n      -\
      \ --enable-force-include-usage\n  gateway:\n    className: epponly\n    externallyManaged:\
      \ true\n  huggingface:\n    secretName: hf-secret\n  model:\n    blockSize:\
      \ 16\n    gpuMemoryUtilization: 0.9\n    huggingfaceId: meta-llama/Llama-3.3-70B-Instruct\n\
      \    maxModelLen: 131072\n    name: meta-llama/Llama-3.3-70B-Instruct\n    path:\
      \ models/meta-llama/Llama-3.3-70B-Instruct\n    shortName: meta-llama-llama-3.3-70b-instruct\n\
      \    size: 1Ti\n  modelArtifacts:\n    extraLabels:\n      pd-infocomm.io/gpu-type:\
      \ H100_SXM_80GB\n  name: pdinfocomm3\n  prefill:\n    acceleratorType:\n   \
      \   labelKey: kubernetes.io/hostname\n      labelValue: ''\n      labelValues:\n\
      \      - pokprod-b93r38s0\n      - pokprod-b93r38s2\n      - pokprod-b93r38s3\n\
      \      - pokprod-b93r39s0\n      - pokprod-b93r39s1\n      - pokprod-b93r39s2\n\
      \      - pokprod-b93r43s0\n      - pokprod-b93r43s1\n      - pokprod-b93r43s2\n\
      \      - pokprod-b93r43s3\n      - pokprod-b93r44s0\n      - pokprod-b93r44s1\n\
      \      - pokprod-b93r44s2\n    enabled: true\n    extraContainerConfig:\n  \
      \    securityContext:\n        capabilities:\n          add:\n          - IPC_LOCK\n\
      \          - SYS_RAWIO\n          - NET_ADMIN\n          - NET_RAW\n       \
      \ runAsGroup: 0\n        runAsUser: 0\n    extraEnvVars:\n    - name: UCX_LOG_LEVEL\n\
      \      value: info\n    - name: UCX_PROTO_INFO\n      value: y\n    - name:\
      \ NIXL_LOG_LEVEL\n      value: debug\n    - name: NCCL_DEBUG\n      value: INFO\n\
      \    - name: NVSHMEM_DEBUG\n      value: INFO\n    initContainers:\n    - command:\n\
      \      - set_llmdbench_environment.py\n      - -e\n      - /shared-config/llmdbench_env.sh\n\
      \      - -i\n      imageKey: benchmark\n      imagePullPolicy: Always\n    \
      \  name: preprocess\n      volumeMounts:\n      - mountPath: /shared-config\n\
      \        name: shared-config\n    parallelism:\n      data: 1\n      dataLocal:\
      \ 1\n      tensor: 4\n      workers: 1\n    replicas: 1\n    resources:\n  \
      \    limits:\n        cpu: '16'\n        memory: 64Gi\n      requests:\n   \
      \     cpu: '8'\n        memory: 32Gi\n    vllm:\n      additionalFlags:\n  \
      \    - --max-num-seqs=256\n      - --max-num-batched-tokens=32768\n      - --enable-chunked-prefill\n\
      \      - --enable-prefix-caching\n      - --enable-force-include-usage\n  router:\n\
      \    epp:\n      flags:\n        allow-experimental-plugins: true\n        v:\
      \ '4'\n      pluginsConfigFile: custom-plugins.yaml\n      pluginsCustomConfig:\n\
      \        custom-plugins.yaml: \"apiVersion: llm-d.ai/v1alpha1\\nkind: EndpointPickerConfig\\\
      n\\\n          plugins:\\n# --- Producers: the signals both the baseline and\
      \ both arms read\\\n          \\ -------\\n#\\n# DECLARED IN THE BASELINE ON\
      \ PURPOSE. Both treatment arms\\\n          \\ read a_r\\n# (config.md §5 signal\
      \ 10) and a_p (signal 11), and signal 11's\\\n          \\ note is\\n# explicit\
      \ that the prefix signal must be bound BY PRODUCER NAME\\\n          \\ so both\\\
      n# arms read ONE signal -- a data key's identity includes its\\\n          \\\
      \ producer\\n# name, so an unbound read can silently become a second,\\n#\\\n\
      \          \\ differently-configured signal. Declaring the producers once here\
      \ and\\n\\\n          # inheriting them is what makes that binding shared rather\
      \ than\\n# per-arm.\\n\\\n          - type: token-producer\\n  parameters:\\\
      n    # ${model.name} is expanded by\\\n          \\ llm-d-benchmark at render\
      \ time; passed\\n    # through verbatim rather\\\n          \\ than substituted\
      \ here.\\n    modelName: ${model.name}\\n    vllm:\\n    \\\n          \\  #\
      \ The loopback render sidecar in the EPP pod, enabled by the\\n      #\\\n \
      \         \\ `tokenizer-sidecar` defaults fragment (NOT in\\n      # transfer.yaml:defaults.disable).\\\
      \n          \\ config.md §11: with nothing\\n      # serving :8000 the failure\
      \ is SILENT\\\n          \\ -- getUserInputLenInTokens\\n      # returns 0 with\
      \ no error, every prompt\\\n          \\ reads as shorter than any\\n      #\
      \ threshold, and no disaggregation is\\\n          \\ ever chosen. The observable\\\
      n      # signature is thousands of requests\\\n          \\ and zero prefill\
      \ selections.\\n      url: \\\"http://localhost:8000\\\"\\n-\\\n          \\\
      \ type: approx-prefix-cache-producer\\n\\n# --- The threshold decider --------------------------------------------\\\
      n\\\n          - type: prefix-based-pd-decider\\n  parameters:\\n    # UNDERIVABLE\
      \ FROM THIS\\\n          \\ BUNDLE, and stated as a decision rather than\\n\
      \    # left to a default.\\\n          \\ The simulation arm is named\\n   \
      \ # `llmd_prefix_threshold_workload_tuned`\\\n          \\ -- the threshold\
      \ was tuned\\n    # PER WORKLOAD -- and no file in sim_results/,\\\n       \
      \   \\ config.md, or README.md\\n    # records the tuned values. 512 is llm-d's\\\
      \n          \\ own guide value\\n    # (llm-d-benchmark config/scenarios/guides/pd-disaggregation.yaml\\\
      \n          \\ and\\n    # the disagg profile-handler README example).\\n  \
      \  #\\n    # WHY\\\n          \\ IT IS NOT 0: `nonCachedTokens: 0` DISABLES\
      \ the decider entirely\\n    #\\\n          \\ (the disagg README is explicit\
      \ -- it always returns false), which\\n  \\\n          \\  # would silently\
      \ turn the P/D baseline into a decode-only baseline\\n\\\n          \\    #\
      \ while still deploying a prefill pod. That is a different arm.\\n \\\n    \
      \      \\   #\\n    # If the tuned per-workload values are recovered upstream,\
      \ set\\\n          \\ them\\n    # here and re-assemble; the baseline number\
      \ in sim_results/\\\n          \\ is not\\n    # reproducible at an arbitrary\
      \ threshold, so treat baseline-vs-sim\\n\\\n          \\    # comparisons as\
      \ unanchored until then. Arm-vs-arm comparisons are\\n\\\n          \\    #\
      \ unaffected: both treatments replace this decider outright.\\n    nonCachedTokens:\\\
      \n          \\ 512\\n\\n- type: disagg-profile-handler\\n  parameters:\\n  \
      \  deciders:\\n\\\n          \\      prefill: prefix-based-pd-decider\\n\\n#\
      \ --- Role filters and load-shaped\\\n          \\ scorers ------------------------------\\\
      n- type: prefill-filter\\n- type:\\\n          \\ decode-filter\\n- type: prefix-cache-scorer\\\
      n  parameters:\\n    # BOUND\\\n          \\ BY PRODUCER NAME -- config.md §5\
      \ signal 11. Explicit even\\n    # though\\\n          \\ it matches the producer\
      \ declared above, so a second\\n    # producer cannot\\\n          \\ silently\
      \ capture this read.\\n    prefixMatchInfoProducerName: approx-prefix-cache-producer\\\
      n\\\n          - type: queue-scorer\\n- type: kv-cache-utilization-scorer\\\
      n- type: active-request-scorer\\n\\\n          \\nschedulingProfiles:\\n# Profile\
      \ names match disagg-profile-handler's defaults\\\n          \\ (`decode`,\\\
      n# `prefill`), so no `profiles:` block is needed.\\n- name:\\\n          \\\
      \ decode\\n  plugins:\\n  - pluginRef: decode-filter\\n  - pluginRef: active-request-scorer\\\
      n\\\n          \\    weight: 2\\n  - pluginRef: prefix-cache-scorer\\n    weight:\
      \ 3\\n- name:\\\n          \\ prefill\\n  plugins:\\n  - pluginRef: prefill-filter\\\
      n  - pluginRef: prefix-cache-scorer\\n\\\n          \\    weight: 3\\n  - pluginRef:\
      \ queue-scorer\\n    weight: 2\\n  - pluginRef:\\\n          \\ kv-cache-utilization-scorer\\\
      n    weight: 2\\n\"\n      replicas: 1\n    inferenceObjectives:\n    - name:\
      \ standard\n      priority: 3\n    proxy:\n      args:\n      - --service-node\n\
      \      - envoy-sidecar\n      - --log-level\n      - warn\n      - --concurrency\n\
      \      - '8'\n      - --drain-strategy\n      - immediate\n      - --drain-time-s\n\
      \      - '60'\n      - -c\n      - /etc/envoy/envoy.yaml\n      resources:\n\
      \        limits:\n          cpu: '8'\n          memory: 16Gi\n        requests:\n\
      \          cpu: '4'\n          memory: 8Gi\n    tokenizer:\n      enabled: true\n\
      \      env:\n      - name: HF_TOKEN\n        valueFrom:\n          secretKeyRef:\n\
      \            key: HF_TOKEN\n            name: hf-secret\n      - name: HF_HOME\n\
      \        value: /tmp/hf\n  routing:\n    connector: nixlv2\n    proxy:\n   \
      \   resources:\n        limits:\n          cpu: '8'\n          memory: 16Gi\n\
      \        requests:\n          cpu: '4'\n          memory: 8Gi\n  storage:\n\
      \    modelPvc:\n      size: 1Ti\n  vllmCommon:\n    flags:\n      disableUvicornAccessLog:\
      \ false\n      enforceEager: false\n    kvTransfer:\n      connector: NixlConnector\n\
      \      enabled: true\n      role: kv_both\n    networkNr: '1'\n    networkResource:\
      \ rdma/roce_gdr\n    preprocessScript: export LD_LIBRARY_PATH=$(find / -name\
      \ libcuda.so.1 -printf '%h\\n'\n      2>/dev/null | sed ':a; N; $!ba; s/\\n/:/g'):${LD_LIBRARY_PATH};\
      \ export LIBRARY_PATH=$(find\n      / -name libcuda.so.1 -printf '%h\\n' 2>/dev/null\
      \ | head -1):${LIBRARY_PATH};\n      . /shared-config/llmdbench_env.sh\n   \
      \ ucxTls: rc,sm,cuda_ipc,cuda_copy\n    volumeMounts:\n    - mountPath: /shared-config\n\
      \      name: shared-config\n    - mountPath: /dev/shm\n      name: dshm\n  \
      \  volumes:\n    - emptyDir: {}\n      name: shared-config\n      type: emptyDir\n\
      \    - emptyDir:\n        medium: Memory\n        sizeLimit: 16Gi\n      name:\
      \ dshm\n      type: emptyDir\n"
  - name: specContent
    value: "base_dir: /workspace/source/llm-d-benchmark\n\nvalues_file:\n  path: /workspace/source/llm-d-benchmark/config/templates/values/defaults.yaml\n\
      \ntemplate_dir:\n  path: /workspace/source/llm-d-benchmark/config/templates/jinja\n\
      \nscenario_file:\n  path: /tmp/llmdbench-config/scenario.yaml\n"
  - name: workloadName
    value: deep-research-single-turn
  - name: workloadSpec
    value: "{aggregate_rate: 0.26, category: language, cohorts: [{arrival: {process:\
      \ poisson},\n      id: deep-research, input_distribution: {params: {max: 121000,\
      \ min: 2000, mu: 10.477875,\n          sigma: 0.687812}, type: lognormal}, output_distribution:\
      \ {params: {max: 4000,\n          mean: 300, min: 50, std_dev: 850}, type: gaussian},\
      \ population: 5, prefix_group: deep-research-system-prompt,\n      prefix_length:\
      \ 2000, prefix_sharing: per_member, rate_fraction: 1.0, slo_class: standard,\n\
      \      streaming: true, tenant_id: research-agents}], num_requests: 280, seed:\
      \ 42,\n  version: '2'}"
  - name: benchmarkGitRepoUrl
    value: https://github.com/llm-d/llm-d-benchmark.git
  - name: benchmarkGitCommit
    value: 1b18402b9ae2c12ef86628533c6b03c37b732a6c
  - name: blisGitRepoUrl
    value: https://github.com/kalantar/inference-sim.git
  - name: blisGitCommit
    value: 583f719507f31c24dd675d30daa79c33950c5516
  - name: model
    value: meta-llama/Llama-3.3-70B-Instruct
  - name: replica
    value: '1'
  - name: maxConcurrency
    value: '10000'
  - name: timeout
    value: '1800'
  - name: warmupRequests
    value: '50'
  - name: prewarmDuration
    value: 60s
  pipelineRef:
    name: sim2real
  taskRunSpecs:
  - pipelineTaskName: stream-epp-logs
    timeout: 3h
  - pipelineTaskName: stream-gpu-stats
    timeout: 3h
  - pipelineTaskName: run-workload-blis-observe-binary
    timeout: 3h
  taskRunTemplate:
    serviceAccountName: helm-installer
  timeouts:
    pipeline: 4h
  workspaces:
  - name: data-storage
    persistentVolumeClaim:
      claimName: data-pvc
  - name: source
    persistentVolumeClaim:
      claimName: source-pvc
