      \ runAsGroup: 0\n        runAsUser: 0\n    extraEnvVars:\n    - name: UCX_LOG_LEVEL\n\
      \      value: info\n    - name: UCX_PROTO_INFO\n      value: y\n    - name:\
      \ NIXL_LOG_LEVEL\n      value: debug\n    - name: NCCL_DEBUG\n      value: INFO\n\
      \    - name: NVSHMEM_DEBUG\n      value: INFO\n    initContainers:\n    - command:\n\
