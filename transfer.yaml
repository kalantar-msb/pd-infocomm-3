kind: sim2real-transfer
version: 3

scenario: pdinfocomm3

component:
  repo: github.com/llm-d/llm-d-router
  kind: EndpointPickerConfig
  # Tag v0.9.0. `v0.9.0^{commit}` resolves to exactly this SHA (the tag is
  # annotated, object dda86863), so the latest stable release and the pin in
  # README.md, config.md, and all three arms' PINS headers are the same commit.
  # Verified present at this ref: the 7-field Metrics struct
  # (pkg/epp/framework/interface/datalayer/metrics.go), the scheduling picker
  # plugin tree, and apix/config/v1alpha1/endpointpickerconfig_types.go.
  ref: 5f4e762f341a5196393ce79f8a57c3e1900c4a6b
  base_image:
    hub: ghcr.io/llm-d
    name: llm-d-router
  build:
    commands:
    # 1. The component's own gates (Makefile:254-257, :266-270). Invoked
    #    directly rather than via `make lint` / `make test-unit`, which run
    #    inside the builder container image (image-build-builder) and are not
    #    available to the translation writer.
    - "make build"
    - "go vet ./pkg/epp/framework/plugins/scheduling/profilehandler/... ./cmd/epp/runner/..."
    - "golangci-lint run --config=./.golangci.yml ./pkg/epp/framework/plugins/scheduling/profilehandler/... ./cmd/epp/runner/..."
    # `typos` is the second half of the repo's lint gate; omitted because the
    # binary is not present in this environment. Run it manually before merge.

    # 2. The new plugins' own packages. -count=1 is REQUIRED, not stylistic:
    #    leastttftjoint/overlay_test.go:139 reads the treatment overlay with
    #    os.ReadFile from outside the Go module, so it is not hashed into the
    #    test cache key and a cached PASS can coexist with a known-bad overlay.
    - "go test -count=1 ./pkg/epp/framework/plugins/scheduling/profilehandler/causalsloexternality/..."
    - "go test -count=1 ./pkg/epp/framework/plugins/scheduling/profilehandler/leastttftjoint/..."
    #    -race separately: the plugin keeps a shadow table written from a
    #    response-body goroutine and read from the scheduling path.
    - "go test -count=1 -race ./pkg/epp/framework/plugins/scheduling/profilehandler/..."

    # 3. Blast radius: the trees the plugin depends on or could break, plus the
    #    file it modifies for registration.
    - "go test ./pkg/epp/scheduling/..."
    - "go test ./pkg/epp/framework/..."
    - "go build ./cmd/epp/..."

algorithms:
  - name: causalsloexternality
    source: algorithms/causal_slo_externality.go
    defaults: baseline
  - name: leastttftjoint
    source: algorithms/least_ttft_joint.go
    defaults: baseline
  # algorithms/kairos_paper.go is deliberately NOT registered, per config.md §9.4,
  # README.md ("Why Kairos is specified but not registered"), and the file's own
  # header. It is blocked on a vLLM `num_pending_prefill_tokens` gauge (K1,
  # config.md §5 signal 29). Reading zero does not add noise, it INVERTS the
  # comparator: the eligibility gate is a disjunction, so zeroing the second
  # operand degrades it from "exclude any node with a deflected prefill in flight"
  # to "exclude only a node being chunk-prefilled this step", and the pool
  # queue-wait term collapses to zero, making remote prefill look free. Both push
  # the same way, so a zero-filled run measures a more aggressive relative of
  # Kairos in the direction that makes it look worse -- a misreport, not a partial
  # result. Add it with `sim2real translation append` once the gauge exists.

baselines:
  - name: baseline
    scenario: baselines/baseline.yaml

workloads:
  - workloads/deep-research-single-turn.yaml
  - workloads/interactive-chat-single-turn.yaml
  - workloads/reasoning-single-turn.yaml

blis_observe:
  maxConcurrency: 10000  # source: config.md
  timeout: 1800  # source: config.md
  warmupRequests: 50  # source: config.md
  prewarmDuration: "60s"  # source: config.md
  # DEVIATES FROM config.md §8, DELIBERATELY. §8 declares no extra flags; this
  # carries one. Operator decision of 2026-08-27, taken with the measurement cost
  # below understood and accepted. Recorded here rather than hand-edited into
  # generated PipelineRuns, which is what previously stranded the setting outside
  # the source.
  #
  # OPEN BLOCKER this works around, inherited from pd-infocomm-2 and still live at
  # the pinned target: this is a P/D bundle (prefill 1 / decode 2, NixlConnector,
  # routing.connector nixlv2) with the same three workloads, so the `min_tokens`
  # conflict that bundle hit applies here.
  #
  # THE MECHANISM IS NARROWER THAN pd-infocomm-2 RECORDED, and the difference
  # matters for option (1). That bundle stated the connector "never touches
  # min_tokens". At v0.9.0 it does -- but only on the /generate path. The clamp is
  # driven by a per-API field list (proxy.go:129-131):
  #     chatCompletionTokenLimitFields = {max_tokens, max_completion_tokens}
  #     generateStyleTokenLimitFields  = {max_tokens, min_tokens}
  # applied at connector_nixlv2.go:174-176 (`tokenMap[field] = 1`), with the API
  # type fixed by the route: POST /v1/completions -> APITypeChatCompletions
  # (proxy.go:487), i.e. the list WITHOUT min_tokens. The test asserting
  # min_tokens == 1 on the prefill leg (connector_nixlv2_test.go:755) is explicitly
  # a *generate* API test. `blis observe` posts /v1/completions and sets
  # MinTokens = MaxOutputLen per request (observe_cmd.go:1441-1461), so every
  # disaggregated request reaches prefill with min_tokens > max_tokens=1 and vLLM
  # rejects it:
  #   ValueError: min_tokens must be less than or equal to max_tokens=1, got 228
  #   POST /v1/completions HTTP/1.1" 400 Bad Request
  #
  # Three options, recorded at pd-infocomm-2 docs/signal-mapping.md §8.5, none
  # resolved there:
  #   (1) Fix llm-d-router -- THE CORRECT FIX, and now known to be a ONE-LINE
  #       change with a shape upstream already endorses: add requestFieldMinTokens
  #       to chatCompletionTokenLimitFields (proxy.go:129), exactly as
  #       generateStyleTokenLimitFields (:131) already does. The save/restore
  #       machinery at connector_nixlv2.go:119 and :324 then restores the client's
  #       min_tokens for the decode leg with no further work, so the output-length
  #       spec is preserved and this flag becomes unnecessary. Check
  #       connector_mooncake.go and connector_shared_storage.go for the same gap.
  #       PREFER THIS as soon as a submodule patch is acceptable; it is the only
  #       option that keeps absolute values comparable to sim_results/.
  #   (2) *** TAKEN 2026-08-27 *** extraArgs: "--unconstrained-output" -- sets
  #       MinTokens=0 and omits max_tokens, so output runs to EOS bounded only by
  #       max_model_len minus prompt. It CHANGES THE MEASURED QUANTITY: goodput is
  #       a hard conjunction over TTFT, mean ITL, and E2E, and E2E scales in output
  #       length against tau_e2e = 16 s. Common-mode across arms, so ORDERING
  #       claims may survive; absolute values are NOT comparable to sim_results/.
  #       pd-infocomm-2's realized record rejects it for measurement runs while its
  #       own transfer.yaml carries it -- read that as an unblock under protest.
  #   (3) Small BLIS patch -- MinTokens=0 while keeping MaxOutputLen. Preserves the
  #       output-length spec. No flag exists today.
  #
  # WHAT THIS COSTS THE RESULTS, so no reader has to reconstruct it:
  #   - Output length is no longer drawn from each workload's declared
  #     distribution. interactive-chat declares gaussian(mean 300, cap 1000)
  #     against tau_e2e = 16 s; unconstrained, the ceiling is max_model_len
  #     (131072) minus prompt. reasoning is least affected (tau_e2e = 802 s,
  #     output already capped at 32000).
  #   - Goodput is a hard conjunction over TTFT, mean ITL and E2E, and E2E scales
  #     in output length, so E2E in particular measures something other than what
  #     the campaign measured. ABSOLUTE VALUES ARE NOT COMPARABLE TO sim_results/.
  #   - The flag is common-mode across both arms, so ORDERING claims may survive.
  #     The bundle's pre-registered expectation is an ordering claim with no
  #     pre-registered margin (README, "Pre-registered expectation" item 1), which
  #     is what this deviation leaves intact.
  #   - It applies to ALL THREE workloads unavoidably: blis_observe is a single
  #     global block with no per-workload seam, and the trigger is
  #     workload-independent.
  # Revisit as soon as option (1) is available; it is one line upstream and it
  # restores comparability.
  extraArgs: "--unconstrained-output"  # operator decision 2026-08-27 (option 2); DEVIATES from config.md §8

context:
  text: |
    Joint causal-SLO-externality P/D placement. The decision rule is a joint
    argmin over (decode endpoint d, prefill placement p) of

        J(d, p) = V * ( externality(d, p) - ownGood(d, p) ),   V = 8

    with the capacity term disabled (the `causal_externality_no_capacity_v8`
    controller, config.md §9.2). Candidates are priced by the smooth SLO value
    they destroy among their residents, evaluated causally: every completion
    model is gated on an admission window, so a resident finishing before the
    arrival is admitted contributes exactly zero. That gating is what makes the
    term an externality rather than another load proxy, and it is why the effect
    survives on a fleet whose load signals are already balanced.

    REQUIRED SHAPE -- a joint argmin over the cross product: D local candidates
    plus D*P disaggregated candidates, scored on one scale in one argmin. This
    CANNOT be a per-endpoint Scorer at this pin, for two independent reasons: a
    scorer returns a per-endpoint map, so no pair can be named; and every scorer
    contribution passes through the profile's score-range enforcement, which
    clamps to [0,1], while J is signed and unbounded -- clamping collapses every
    candidate with J <= 0 to one score, destroying the ranking rather than
    degrading it. The comparator faces the same hazard for a different reason:
    its objective is a latency in microseconds, non-negative and unbounded above.

    PLACEMENT -- TWO plugin registrations sharing state, not one plugin with two
    interfaces. ProfileHandler.Pick and Picker.Pick share a method name with
    different signatures (pkg/epp/framework/interface/scheduling/plugins.go:47,
    :77), so no single Go type can satisfy both:

      Handler: ProfileHandler (Pick, ProcessResults) + PreRequest +
              ResponseBodyProcessor
      Picker:  Filter + Picker

    Filter is required, not incidental: Picker.Pick receives only
    []*ScoredEndpoint and no request, so the arriving request's token count
    reaches the argmin no other way. All profiles receive the same
    candidateEndpoints slice (pkg/epp/scheduling/scheduler.go:78), so an
    unfiltered profile sees both pools; ProfileRunResult.TargetEndpoints is a
    slice (pkg/epp/framework/interface/scheduling/types.go:165-167), so one
    picker run carries both picks.

    THE HAZARD IS SILENT FALLBACK to the target's natural decode-first
    decomposition: pick a decode endpoint with the stock scorer, then decide
    placement. That is the simulation's decode-first ablation arm, so its cost is
    measured rather than estimated -- +0.0485 equal-cell mean goodput in favour of
    the joint shape, 95% CI [+0.0305, +0.0665], worst cell falling 0.918 -> 0.700
    at h100_a100_realistic:interactive:medium_0p80. A port that keeps the stock
    handler and moves J into a binary disaggregate() gate still runs, still
    reports goodput, and is running a different algorithm. The decomposition
    switch is kept reachable (config.md §10) because flipping it is the cheapest
    on-cluster check that the joint shape survived the port.

    Three settings are forced on an internal copy of the decider rather than
    exposed as flags, so a port must hard-wire them: exact prefill overlap,
    deployable resident estimates (censored N_out, never true remaining), and
    collocated-prefill pricing (config.md §9.2).

    THETA IS KEYED BY POD LABEL, NOT BY THE SCENARIO (config.md §5 signal 8, §2).
    Per-GPU coefficients differ most in the per-iteration intercept -- 25 563.82 us
    on A100 against 16 613.54 us on H100, a factor of 1.539 present on EVERY
    iteration regardless of KV state -- so a wrong or defaulted GPU label is wrong
    on every decision. Reject absent or unknown types; never default. Both
    coefficient files must be transcribed into every arm's plugin config, keyed by
    label value, so the A100 decode instance is priced correctly whether or not the
    generated scenario names it.

    FLEET CAPABILITY GAP, disclosed not silent (config.md §2). The campaign's
    decode pool is genuinely heterogeneous -- instance_1 on H100, instance_2 on
    A100 -- and that heterogeneity is the condition the mechanism exploits. The
    scenario schema expresses one acceleratorType per role and has no construct
    for per-instance hardware within a role, so the generated baseline names H100
    for both roles and describes only instance_1. The A100 decode pod must be
    deployed outside the generated scenario or the scenario hand-edited. This
    bundle deliberately does not choose among config.md §2's options.

    DECLARED DEGRADATION (D1): every cited margin was produced with the
    scheduler-rollout TTFT model, whose per-request wait-queue inputs are
    unobtainable at this pin -- the target exposes WaitingQueueSize, one integer.
    The port substitutes the closed-form rollforward estimator, which past one
    batch drain understates admission delay and so biases toward remote prefill.
    A substitution counter is required, not optional: the fallback is acceptable,
    the silence is the defect. Net direction across all declared degradations is
    NOT known and is NOT claimed -- D1 biases remote, D2b and D2c bias local.
    See README.md, "Pre-registered expectation" and "Open threats to validity".
  files:
    - README.md
    - config.md
    - inputs/coeffs-llama70b-h100-tp4.json
    - inputs/coeffs-llama70b-a100real-tp4.json
    - inputs/hetero-realistic-1p2d.yaml

defaults:
  # These four ship DISABLED. Each is copied into baselines/defaults/ so there is
  # something to enable rather than reinvent, but none can be a correct always-on
  # default. Enabling one is deleting its line.
  #   nic-exclusion            -- a literal device list for one cluster's cards
  #   pod-capabilities         -- needs an out-of-band `oc adm policy add-scc-to-user
  #                               privileged`; enabled-by-default yields unschedulable pods
  #   preserve-request-id      -- an Istio EnvoyFilter selecting a hardcoded gateway
  #                               name; under epponly + externallyManaged no Gateway is
  #                               deployed, so it matches nothing, and it is the only
  #                               fragment using extraObjects so the only one that can
  #                               fail at APPLY time rather than being silently inert
  #   rdma-device-reservation  -- reserves an rdma/roce_gdr the pod netns cannot use
  disable:
    - nic-exclusion
    - pod-capabilities
    - preserve-request-id
    - rdma-device-reservation
  # Available fragments (filename stems in baselines/defaults/):
  #   - epp-verbosity
  #   - epponly
  #   - externally-managed-gateway
  #   - model-pvc-size
  #   - nic-exclusion               (ships disabled)
  #   - pod-capabilities            (ships disabled)
  #   - preserve-request-id         (ships disabled)
  #   - rdma-device-reservation     (ships disabled)
  #   - routing-proxy-resources
  #   - tokenizer-sidecar
  #   - vllm-keepalive
  #   - vllm-logging
