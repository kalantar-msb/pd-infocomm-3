      pullPolicy: Always
      registry: ghcr.io/kalantar
      repository: llm-d-router
      tag: cee8bb60cbc3-causalsloexternality
    pluginsConfigFile: custom-plugins.yaml
    pluginsCustomConfig:
      custom-plugins.yaml: "apiVersion: llm-d.ai/v1alpha1\nkind: EndpointPickerConfig\n\
        plugins:\n# ===================================================================\n\
        # Inherited producers -- IDENTICAL to the baseline's, restated because\n#\
        \ this string replaces the baseline's wholesale.\n# ===================================================================\n\
        # a_r, config.md \xA75 signal 10. BUILT: tokenizer sidecar + this plugin.\n\
        # Read as `request.Body.TokenizedPrompt.TokenCount()`; the field is a\n# NULLABLE\
        \ pointer and absence is a real runtime state (degradation D8).\n- type: token-producer\n\
        \  parameters:\n    modelName: meta-llama/Llama-3.3-70B-Instruct\n    vllm:\n\
        \      url: \"http://localhost:8000\"\n# a_p, config.md \xA75 signal 11. Publishes\
        \ PrefixCacheMatchInfo as a\n# per-endpoint attribute; the arm binds it BY\
        \ PRODUCER NAME below.\n- type: approx-prefix-cache-producer\n\n# ===================================================================\n\
        # THE ARM -- TWO REGISTRATIONS SHARING ONE STATE OBJECT\n# ===================================================================\n\
        # NOT one plugin with two interfaces. `ProfileHandler.Pick` and\n# `Picker.Pick`\
        \ share a method name with different signatures\n# (pkg/epp/framework/interface/scheduling/plugins.go:47,\
        \ :77), so no single\n# Go type can satisfy both. The split is forced by the\
        \ target's interface\n# set, not chosen:\n#\n#   causal-slo-externality-handler\
        \  ProfileHandler + PreRequest +\n#                                   ResponseBodyProcessor\n\
        #   causal-slo-externality-picker   Filter + Picker\n#\n# THE HANDLER OWNS\
        \ THE STATE -- the Policy, the coefficient table, and the\n# shadow table.\
        \ The picker names it in `handlerPluginName` and looks it up\n# with `handle.Plugin`.\n\
        #\n# CONSTRUCTION ORDER IS CARRIED BY THAT REFERENCE, NOT BY POSITION IN THIS\n\
        # LIST. `instantiatePlugins` topologically sorts a plugin DAG before building\n\
        # anything (pkg/epp/config/loader/configloader.go:244-250), and dependencies\n\
        # are constructed first because `TopologicalSort` reverses its result -- edges\n\
        # point from consumer to producer (pkg/epp/util/utils.go:75-76). The edge\
        \ here\n# comes from the `pluginRef` tag on the picker's `handlerPluginName`\
        \ field,\n# which `findPluginDependencies` discovers by reflection (configloader.go:304-336).\n\
        #\n# So reordering these two entries changes nothing, and REMOVING the reference\n\
        # would break startup rather than ordering: two plugins with no edge between\n\
        # them both sit at in-degree 0, and their relative order comes from ranging\
        \ a\n# Go map (pkg/epp/util/utils.go:42-46), which is randomized per process.\
        \ The\n# picker's factory errors on a nil lookup rather than constructing\
        \ a second,\n# divergent copy of the shadow table, so the EPP would crashloop\
        \ on roughly\n# 5 starts out of 6 instead of silently splitting the resident\
        \ population.\n#\n# The handler is nonetheless written first here for readability.\n\
        #\n# State ownership follows lifecycle ownership: the handler holds the\n\
        # response hooks that WRITE the table (PreRequest stamps the arrival,\n# ResponseBody\
        \ advances StepsDone and the realized first token), so it owns\n# it and the\
        \ picker reads through a pointer.\n#\n# NOTE: llm-d's `PluginState` is deliberately\
        \ NOT used for this link. Its\n# own doc forbids it -- \"PluginState is not\
        \ a cross-plugin handoff channel\"\n# (pkg/epp/framework/interface/plugin/plugin_state.go:51-54)\
        \ -- and it is\n# keyed per request, whereas the shadow table must outlive\
        \ every request in\n# it.\n#\n# WHY THE ARGMIN IS A PICKER AND NOT A SCORER,\
        \ verified at the pin and\n# restated because getting it wrong still runs\
        \ and still reports goodput:\n#   - a scorer returns a per-endpoint map and\
        \ has NO WAY TO NAME A PAIR,\n#     while the objective is over (decode endpoint,\
        \ prefill placement);\n#   - every scorer contribution passes through the\
        \ profile's score-range\n#     enforcement, which CLAMPS to [0,1], while J\
        \ is signed and unbounded.\n#     Clamping does not degrade the ranking, it\
        \ DESTROYS it: every candidate\n#     with J <= 0 collapses to one score.\n\
        #\n# A Filter is required, not incidental: `Picker.Pick(ctx, []*ScoredEndpoint)`\n\
        # receives NO REQUEST, so the arriving request's token count reaches the\n\
        # argmin no other way. There is no CycleState at this pin -- the type does\n\
        # not exist -- so the Filter hands the request-derived operands to the\n#\
        \ Picker by `Endpoint.Put` on the per-request endpoint clones the director\n\
        # builds fresh for every cycle (director.go:479-486), which the Picker reads\n\
        # back with `Get`. Those clones are private to one request, which is what\n\
        # makes the handoff race-free.\n#\n# `disagg-profile-handler` MUST NOT APPEAR\
        \ IN THIS CONFIG, and its absence\n# above is deliberate: exactly ONE ProfileHandler\
        \ is permitted across all\n# instantiated plugins (configloader.go:380-394\
        \ errors with \"multiple\n# profile handlers found\"). This arm's handler\
        \ therefore does the whole job\n# itself, including setting the prefill routing\
        \ header.\n- type: causal-slo-externality-handler\n  parameters:\n\n    #\
        \ -------------------------------------------------------------\n    # The\
        \ objective -- config.md \xA79.2\n    # -------------------------------------------------------------\n\
        \    # J(d, p) = V * (externality - ownGood) + capacity, capacity disabled.\n\
        \    #\n    # V IS KEPT, NOT FOLDED AWAY, even though with capacity disabled\
        \ it is\n    # a common positive multiplier that cannot change the argmin:\
        \ the\n    # ablation cohort's validity gate asserts\n    # score = 8 * (externality\
        \ - own_good) EXACTLY, and a port that folds\n    # V away cannot reproduce\
        \ that check.\n    v: 8\n\n    ablation:\n      # THE `no_capacity` CONTROLLER.\
        \ Capacity drift disabled, so\n      # total = 8 * (externality - ownGood).\n\
        \      noCapacity: true\n      # Keep the externality -- it IS the mechanism.\
        \ Removing it costs\n      # 0.0154 equal-cell mean goodput, CI [+0.0112,\
        \ +0.0195]\n      # (config.md \xA710) -- the only term with a supported effect.\n\
        \      noExternality: false\n      # Keep the arriving request's own good.\
        \ CARRIED DESPITE NO MEASURED\n      # BENEFIT: removing it GAINS 0.0016 and\
        \ the CI crosses zero,\n      # [-0.0053, +0.0022] (config.md \xA710), and\
        \ `joint resident-only`\n      # reaches 0.9280 equal-cell mean against the\
        \ full policy's 0.9264.\n      # The focal arm keeps it (`SLOExternalityNoOwnGood:\
        \ false`), so the\n      # transfer carries a term with no measured benefit\
        \ -- see README.md\n      # \"Where the policy did NOT win\".\n      noOwnGood:\
        \ false\n      # Selects the occupancy-time capacity account instead of the\n\
        \      # quadratic-drift one. Doubly dead here: capacity is off.\n      occupancyCapacity:\
        \ false\n      # THE DECOMPOSITION SWITCH -- config.md \xA710, exposed rather\
        \ than\n      # compiled out because \xA710 makes the decomposition comparison\
        \ the\n      # cheapest on-cluster check that the joint shape survived the\
        \ port:\n      # +0.0485 equal-cell mean goodput in favour of the joint shape,\
        \ 95% CI\n      # [+0.0305, +0.0665], worst cell falling 0.918 -> 0.700 at\n\
        \      # h100_a100_realistic:interactive:medium_0p80.\n      #\n      # READ\
        \ THIS BEFORE FLIPPING IT. `true` restricts the decode enumeration\n     \
        \ # to ONE endpoint. Which endpoint depends on the profile, and with the\n\
        \      # profile as shipped below -- NO SCORERS, which the joint argmin requires\n\
        \      # -- every inherited score is 0, so the restriction lands on the\n\
        \      # LOWEST-ID decode pod: a fixed arbitrary pod, not a load-shaped choice.\n\
        \      #\n      # So flipping this switch ALONE does NOT reproduce \xA710's\n\
        \      # `decode-first full` arm, which fixes decode to a LOAD-SHAPED scorer's\n\
        \      # pick. It measures \"always decode on one particular pod\" -- a different\n\
        \      # and weaker control. A run that flipped only this and lost goodput\
        \ would\n      # look like it confirmed the pre-registered expectation while\
        \ measuring\n      # something else.\n      #\n      # TO REPRODUCE THE \xA7\
        10 ABLATION, also attach the baseline's decode\n      # scorers to the `default`\
        \ profile below (active-request-scorer,\n      # prefix-cache-scorer, ...),\
        \ so there is a real preference to restrict\n      # to. That is safe even\
        \ though scorer contributions are clamped to [0,1]:\n      # the picker ignores\
        \ ScoredEndpoint.Score when computing J, so the clamp\n      # never reaches\
        \ the objective -- the scores would supply only the\n      # tie-break and\
        \ this restriction.\n      decomposed: false\n\n    # -------------------------------------------------------------\n\
        \    # SLO targets -- config.md \xA76\n    # -------------------------------------------------------------\n\
        \    # ALL THREE TRIPLES ARE CARRIED AND ONE IS SELECTED. This is not\n  \
        \  # belt-and-braces: every cohort in all three workloads declares\n    #\
        \ `slo_class: standard`, so the class is ONE CONSTANT STRING across the\n\
        \    # whole grid and a per-request lookup by SLO class CANNOT select the\n\
        \    # triple -- the simulation varies tau PER INVOCATION. Carrying all\n\
        \    # three here and selecting one means the thresholds are never retyped\n\
        \    # and cannot drift between arms; run one assemble per workload,\n   \
        \ # changing only `activeWorkload`.\n    #\n    # `interactive` IS THE COMMITTED\
        \ DEFAULT (config.md \xA76). The composite\n    # kernel reads only tau_ttft\
        \ and tau_e2e, and a resident's charge\n    # scales roughly as 1/tau_e2e,\
        \ so interactive's 16 s deadline gives\n    # ~50x the discrimination of reasoning's\
        \ 802 s -- where the E2E sigmoid\n    # saturates and the externality stops\
        \ separating candidates at all.\n    #\n    # AN UNRESOLVABLE SELECTION FAILS\
        \ AT STARTUP, and so does a\n    # non-positive tau_ttft or tau_e2e in the\
        \ SELECTED triple. A zero triple\n    # does not loosen the policy, it FLATTENS\
        \ it: sloCompositeValue returns\n    # 1.0 for every disabled target, so every\
        \ resident charge becomes\n    # 1.0 - 1.0 = 0, the externality is 0 on every\
        \ candidate, and the argmin\n    # is a tie broken by enumeration order --\
        \ while the policy keeps running\n    # and keeps reporting goodput. tau_e2e\
        \ = 0 is the sharper trap: the\n    # realized-TTFT factor is placement-INVARIANT,\
        \ so it factors out of the\n    # charge and a zero tau_e2e makes the ENTIRE\
        \ decode-side externality\n    # identically zero, degenerating the arm to\
        \ its own-good term alone.\n    activeWorkload: deepResearch\n\n    # Microseconds.\
        \ Source: config.md \xA76, from\n    # run_public_workload_heterogeneity_closeout.py:60-105.\n\
        \    #\n    # tauItlUs is CARRIED BUT NEVER READ BY THE ROUTING KERNEL. The\n\
        \    # composite kernel reads only tau_ttft and tau_e2e; mean ITL is an\n\
        \    # EVALUATION gate on reported goodput, not a routing term. It is\n  \
        \  # present because muDNom() consumes it if the capacity account is ever\n\
        \    # re-enabled, and because omitting a threshold config.md states would\n\
        \    # make this config look like it disagreed with \xA76.\n    workloadTargets:\n\
        \      interactive:\n        tauTtftUs: 1000000      # 1 000 ms\n        tauItlUs:\
        \ 50000         # 50 ms   -- evaluation gate only\n        tauE2eUs: 16000000\
        \      # 16 000 ms\n      reasoning:\n        tauTtftUs: 2000000      # 2\
        \ 000 ms\n        tauItlUs: 100000        # 100 ms  -- evaluation gate only\n\
        \        tauE2eUs: 802000000     # 802 000 ms -- saturates the E2E sigmoid\n\
        \      deepResearch:\n        tauTtftUs: 10000000     # 10 000 ms\n      \
        \  tauItlUs: 100000        # 100 ms  -- evaluation gate only\n        tauE2eUs:\
        \ 40000000      # 40 000 ms\n\n    # -------------------------------------------------------------\n\
        \    # Engine agreement -- config.md \xA75 signals 22-24, \xA79.1\n    # -------------------------------------------------------------\n\
        \    engine:\n      # = max_num_batched_tokens. Signal 22.\n      chunkTokens:\
        \ 32768\n      # = block_size. Signal 23. VALIDATED AGAINST THE SCRAPED\n\
        \      # `Metrics.CacheBlockSize` WITH A LOUD FAILURE ON DISAGREEMENT:\n \
        \     # upstream has ONE block size, and a port carrying two that silently\n\
        \      # convert leaves a latent unit bug in the admission test, which\n \
        \     # compares blocks accumulated in one unit against a need expressed in\n\
        \      # another.\n      blockSize: 16\n      # = max_num_seqs. Signal 24.\
        \ No metric exposes it -- and\n      # `Metrics.KvCacheMaxTokenCapacity` is\
        \ NOT a substitute for anything\n      # here: it is assigned nowhere outside\
        \ tests at this pin, so it always\n      # reads 0 and any branch guarded\
        \ on it being positive is dead code.\n      # KV capacity is derived from\
        \ CacheNumBlocks * CacheBlockSize instead.\n      maxBatchSize: 256\n\n  \
        \  # -------------------------------------------------------------\n    #\
        \ Signal plumbing -- config.md \xA75 signals 8, 9, 11\n    # -------------------------------------------------------------\n\
        \    signals:\n      # Signal 8. theta is keyed by THIS POD LABEL, read from\n\
        \      # `Endpoint.GetMetadata().Labels` (a map[string]string,\n      # datalayer/endpoint_metadata.go:33),\
        \ NOT from the node's\n      # nvidia.com/gpu.product -- plugins see endpoints,\
        \ not nodes.\n      #\n      # An endpoint whose label is ABSENT, or whose\
        \ value is not a key of\n      # `coeffsByGpuType` below, is REJECTED from\
        \ the candidate set and the\n      # rejection COUNTED -- never defaulted.\
        \ Heterogeneity rides the\n      # per-iteration intercept alpha, present\
        \ on every iteration\n      # regardless of KV state, so a defaulted label\
        \ is wrong on EVERY\n      # decision rather than only under load; without\
        \ the counter the\n      # removal would look like a routing PREFERENCE.\n\
        \      gpuTypeLabelKey: pd-infocomm.io/gpu-type\n\n      # Signal 11. BOUND\
        \ BY PRODUCER NAME so both arms read the SAME prefix\n      # signal: a data\
        \ key's identity is \"<DataType>/<ProducerName>\"\n      # (plugin/datakey.go:46-48),\
        \ so an unbound read can silently become a\n      # second, differently-configured\
        \ signal. The plugin also declares this\n      # key through `Consumes()`,\
        \ which makes the producer DAG order it\n      # before the arm and turns\
        \ a missing producer into a startup error\n      # rather than a per-request\
        \ miss.\n      prefixMatchInfoProducerName: approx-prefix-cache-producer\n\
        \n      # Signal 10. Bound BY PRODUCER NAME for the same reason as the prefix\n\
        \      # read above. NOTE WHAT THIS CANNOT DO: the token-producer's `estimate`\n\
        \      # backend is the ZERO-CONFIG DEFAULT and TokenizedPrompt carries no\n\
        \      # provenance marker, so an unreachable tokenizer does NOT surface as\
        \ an\n      # absent prompt -- it surfaces as a plausible ESTIMATED a_r that\n\
        \      # mis-prices every candidate. There is no runtime discriminator. Binding\n\
        \      # the name makes the DAG fail at init if no such producer exists; the\n\
        \      # operator preflight in config.md section 11 (curl the render sidecar)\
        \ is\n      # the only check that it is the real tokenizer, and the plugin's\
        \ D8\n      # counter covers the genuinely-absent case only.\n      tokenizedPromptProducerName:\
        \ token-producer\n\n      # THERE IS DELIBERATELY NO prefixBlockSizeTokens\
        \ KNOB.\n      #\n      # The two-block-size problem is real -- the engine\
        \ reports 16 while\n      # `approx-prefix-cache-producer` clamps its own\
        \ block size up to a\n      # 64-token floor (approximateprefix/plugin.go:42-50,\n\
        \      # minBlockSizeTokens = 64), so multiplying the producer's block COUNT\
        \ by\n      # the ENGINE's block SIZE understates the cached span by 4x, inflating\n\
        \      # a_p and OVER-pricing prefill work, which biases toward remote prefill.\n\
        \      #\n      # But it needs no config: `PrefixCacheMatchInfo` publishes\n\
        \      # `BlockSizeTokens()` alongside `CachedBlockCount()`, so the plugin\
        \ reads\n      # BOTH off the same attribute, per endpoint, per request. That\
        \ is\n      # strictly better than a knob -- a producer reconfiguration cannot\n\
        \      # silently rescale a_p, because there is no second value to drift from.\n\
        \      # engine.blockSize above stays the ENGINE's 16, which is what reqKVNeed\n\
        \      # and the rollout need.\n\n    # -------------------------------------------------------------\n\
        \    # Admission-delay estimator -- DEGRADATION D1\n    # -------------------------------------------------------------\n\
        \    # config.md \xA79.1 declares `rollforward`, and `rollforward` is the\
        \ ONLY\n    # accepted value at this pin. Any other value FAILS AT STARTUP\
        \ rather\n    # than silently degrading:\n    #   `waiting` reads QWork --\
        \ no per-endpoint work account exists;\n    #   `little`  reads AdmissionRate\
        \ -- no route;\n    #   the published `scheduler-rollout` needs the engine's\
        \ ordered wait\n    #   queue, its current grants, and its step start instant.\
        \ The target\n    #   exposes `Metrics.WaitingQueueSize` -- ONE INTEGER\n\
        \    #   (pkg/epp/framework/interface/datalayer/metrics.go:33).\n    #\n \
        \   # THIS IS THE SUBSTITUTION, NOT THE PUBLISHED ESTIMATOR. Every number\n\
        \    # in sim_results/ was produced by the scheduler rollout. rollforward\
        \ is\n    # what the simulation ITSELF falls back to when its rollout guard\n\
        \    # fails, so the substitution is principled -- but past one batch drain\n\
        \    # it UNDERSTATES admission delay => smaller admissionSteps => residents\n\
        \    # charged for more of the arrival's interference => the local candidate\n\
        \    # is OVER-priced => biased toward REMOTE prefill.\n    #\n    # The plugin\
        \ increments a substitution counter on every call that lands\n    # here instead\
        \ of the rollout. That counter is a REQUIREMENT, not\n    # instrumentation:\
        \ the fallback is acceptable, the silence is the\n    # defect. Without it,\
        \ running a different TTFT estimator than the one\n    # that produced every\
        \ published number is invisible in the goodput\n    # figure.\n    admissionEstimator:\
        \ rollforward\n\n    # -------------------------------------------------------------\n\
        \    # Transfer model -- DEGRADATION D5, config.md \xA77. UNMEASURED.\n  \
        \  # -------------------------------------------------------------\n    #\
        \ c_xfer is the ONLY size-dependent price of going remote, entering the\n\
        \    # objective at exactly ONE place (remoteLeadUs), so an unmeasured value\n\
        \    # mis-prices SYSTEMATICALLY rather than noisily. MEASURE xferBaseUs and\n\
        \    # xferBandwidthGbps ON THE TARGET before trusting any magnitude, and\n\
        \    # record the deviation as a stated degradation.\n    transfer:\n    \
        \  sizeAware: true            # config.md \xA79.1\n      # xferBaseUs: 50.0\
        \           # simulator value -- UNMEASURED on target               \n   \
        \   xferBaseUs: 5826.0           # measured in try7               \n     \
        \ # xferBandwidthGbps: 25.0    # simulator value -- UNMEASURED on target\n\
        \      xferBandwidthGbps: 11.0    # measured in try7\n      # 2 (K,V) x 80\
        \ layers x 8 KV heads x 128 head_dim x 2 B / TP 4.\n      # DERIVED ARITHMETIC,\
        \ not measured. Leaving it 0 is severe with\n      # sizeAware: transferBytes\
        \ becomes 0 so every request is charged a\n      # flat xferBaseUs -- a 4k-token\
        \ prompt should be charged ~13 500 us,\n      # roughly 270x under-priced,\
        \ with the error growing linearly toward\n      # the deep-research workload's\
        \ ~45k-token prompts.\n      kvBytesPerTokenPerGpu: 81920\n      # The FLAT\
        \ KV-transfer cost, used only when sizeAware is false. A\n      # DISTINCT\
        \ field from xferBaseUs, which is only the additive base of\n      # the size-aware\
        \ form (upstream sim/edpp.go:77, default 5 ms at\n      # cmd/root.go:1505).\
        \ Conflating the two makes the flat path\n      # unrepresentable and silently\
        \ reprices every disaggregated candidate\n      # if sizeAware is ever turned\
        \ off.\n      flatCXferUs: 5000\n\n    # -------------------------------------------------------------\n\
        \    # theta -- config.md \xA74, keyed by the signal-8 POD LABEL value\n \
        \   # -------------------------------------------------------------\n    #\
        \ BOTH FILES ARE TRANSCRIBED, keyed by label value, so the A100 decode\n \
        \   # instance is priced correctly WHETHER OR NOT the generated scenario\n\
        \    # names it (config.md \xA72, \xA74). The generated scenario names H100\
        \ for\n    # both roles; the hand-added A100 decode pod is priced the moment\
        \ it\n    # carries `pd-infocomm.io/gpu-type: A100_SXM_80GB`, with no\n  \
        \  # plugin-config change.\n    #\n    # THERE IS NO FALLBACK ENTRY, ON PURPOSE.\
        \ An unmapped label must have\n    # already caused the endpoint to be REJECTED;\
        \ a silent default here\n    # would price the endpoint under the wrong physics\
        \ on every decision.\n    # The intercepts differ by a factor of 1.539 (25\
        \ 563.82 us A100 against\n    # 16 613.54 us H100) on EVERY iteration regardless\
        \ of KV state.\n    #\n    # Values copied verbatim from inputs/coeffs-llama70b-h100-tp4.json\
        \ and\n    # inputs/coeffs-llama70b-a100real-tp4.json. Units: alphaD/alphaP\
        \ us,\n    # c0 us/req, c1 and cPf us/token, cAttn us/token^2. The plugin\
        \ runs\n    # upstream's validate() on each entry (sim/edpp_coeffs.go:127-146),\n\
        \    # whose alpha ~= alpha_p bound rejects a pair diverging by more than\n\
        \    # 10% -- a divergence that large means the JSON was fit on mismatched\n\
        \    # hardware or regimes. Both pairs below are within 0.03%.\n    coeffsByGpuType:\n\
        \      H100_SXM_80GB:\n        alphaD: 16613.537554540144\n        alphaP:\
        \ 16617.85321583337\n        c0: 5.347316038602452\n        c1: 0.04761401141756073\n\
        \        cPf: 6.144687138665833\n        cAttn: 0.00010075247918809842\n \
        \     A100_SXM_80GB:\n        alphaD: 25563.819286862163\n        alphaP:\
        \ 25568.34953836831\n        c0: 5.945331876073271\n        c1: 0.07822809856114352\n\
        \        cPf: 9.794219053944662\n        cAttn: 0.00015977670754642687\n\n\
        \    # -------------------------------------------------------------\n   \
        \ # The shadow table -- signals 12-18, DEGRADATIONS D2, D4, D6\n    # -------------------------------------------------------------\n\
        \    # The externality is a sum over INDIVIDUAL residents' deadline slack,\n\
        \    # but vLLM exports resident state only in aggregate, so the plugin\n\
        \    # maintains an EPP-side index of the requests it placed. It is a\n  \
        \  # mutex-guarded LONG-LIVED index, not framework per-request state, and\n\
        \    # the target's own dispatch is what forces that: non-final response\n\
        \    # chunks are drained on a SEPARATE GOROUTINE from an async queue\n  \
        \  # (director.go:541-552, :668+) while the final chunk runs on the request\n\
        \    # goroutine (:539), so writes genuinely arrive concurrently with\n  \
        \  # scheduling-path reads.\n    shadowTable:\n      # THE TTL SWEEP IS REQUIRED,\
        \ NOT HYGIENE. Requests terminate without\n      # a final chunk (client disconnect,\
        \ upstream error) and the\n      # ResponseBodyProcessor signature carries\
        \ NO error or termination\n      # state (requestcontrol/plugins.go:53-65,\
        \ and its own TODO says so),\n      # so a disconnect is indistinguishable\
        \ from a completion. Without the\n      # sweep those entries are charged\
        \ as residents FOREVER and permanently\n      # inflate every externality\
        \ on that endpoint.\n      #\n      # 900 s is chosen against the workload,\
        \ not inherited: the longest\n      # deadline in play is deep_research's\
        \ tau_e2e = 40 s (config.md \xA76)\n      # and reasoning's output distribution\
        \ reaches 32 000 tokens, so a\n      # legitimately live request is far inside\
        \ this bound while a\n      # stranded entry is reaped within one sweep interval.\
        \ UNMEASURED\n      # against real client behaviour -- widen it if the reaped-entries\n\
        \      # counter fires on requests that were still healthy.\n      entryTtlSeconds:\
        \ 900\n      sweepIntervalSeconds: 30\n      # Signal 14 / D4: S_pf is what\
        \ is being prefilled THIS STEP, not the\n      # outstanding backlog, and\
        \ the EPP cannot know what the engine\n      # scheduled. The shadow sum is\
        \ capped per occupant and capped in\n      # total at engine.chunkTokens.\
        \ Still an over-estimate => over-states\n      # local prefill inflation =>\
        \ biased toward REMOTE.\n      residentPrefillTokensCap: 32768\n\n    # -------------------------------------------------------------\n\
        \    # Dead-but-declared: the capacity account\n    # -------------------------------------------------------------\n\
        \    # `ablation.noCapacity: true` makes all three of these dead state. They\n\
        \    # are declared rather than omitted because a HALF-specified subsystem\n\
        \    # is worse than an absent one -- the read side would look complete --\n\
        \    # and because config.md \xA79.2 keeps the switch reachable.\n    #\n\
        \    # TWO OF THEM ARE NOT STATED ANYWHERE IN THE BUNDLE, and are recorded\n\
        \    # here as decisions rather than defaults. A port RE-ENABLING the\n  \
        \  # capacity term must source them properly, and must additionally supply\n\
        \    # a monotonic clock and per-endpoint drain timestamps.\n    capacity:\n\
        \      # NOT IN config.md. The fixed reference tau for the capacity\n    \
        \  # account's scale (state.scale = state.mu * tauRefUs,\n      # sim/edpp.go:1177),\
        \ independent of the operating tau_ttft. Set equal\n      # to interactive's\
        \ tau_ttft for want of a stated value.\n      tauRefUs: 1000000\n      # S_nom,\
        \ the nominal prefill chunk for the fixed prefill normalizer.\n      # Simulator\
        \ default 512 (cmd/root.go:1506).\n      nomPrefillTokens: 512\n      # NOT\
        \ IN config.md. The fixed decode width B used by the\n      # occupancy-time\
        \ capacity account (sim/edpp.go:2381), itself reached\n      # only when `ablation.occupancyCapacity`\
        \ is true -- so this is doubly\n      # dead. Set to engine.maxBatchSize.\n\
        \      referenceBatch: 256\n\n    # -------------------------------------------------------------\n\
        \    # OUTSIDE THE CALIBRATED THETA -- config.md \xA75 signal 25\n    # -------------------------------------------------------------\n\
        \    # The client-visible per-token post-processing latency (streaming\n \
        \   # detokenization), added explicitly to EVERY TTFT projection\n    # (sim/edpp.go:1235-1242)\
        \ because it sits outside theta.\n    #\n    # NOT STATED IN config.md, WHICH\
        \ GIVES NO VALUE, and 0 is the neutral\n    # choice rather than a measured\
        \ one. It is NOT decision-neutral even\n    # though it is added to both the\
        \ local and the disaggregated\n    # projection: both projections feed tHat,\
        \ which enters ownGood through\n    # a SIGMOID, so a common additive constant\
        \ still moves the two\n    # candidates' values by different amounts. Measure\
        \ it on the target\n    # before trusting any magnitude.\n    outputTokenProcessingUs:\
        \ 0.0\n\n# -------------------------------------------------------------------\n\
        # The picker registration -- Filter + Picker, reads the handler's state.\n\
        # -------------------------------------------------------------------\n# Filter\
        \  splits the two pools by role label, REJECTS endpoints whose\n#        \
        \ GPU-type label is absent or unmapped (counting each rejection by\n#    \
        \     reason), and -- because `Picker.Pick` receives no request -- is the\n\
        #         only place the arriving request's operands (a_r, SLO class, the\n\
        #         per-endpoint a_p, the request ID) can be attached to the\n#    \
        \     per-request endpoint clones for the Picker to read back.\n# Picker \
        \ runs the joint argmin over D local plus D*P disaggregated\n#         candidates\
        \ and returns BOTH picks in one ProfileRunResult --\n#         legitimate\
        \ because `ProfileRunResult.TargetEndpoints` is a slice\n#         (scheduling/types.go:164-167).\n\
        #\n# The handler's ProcessResults then SPLITS those two picks into two entries\n\
        # of SchedulingResult.ProfileResults -- primary carrying the decode pick\n\
        # ALONE. That split is mandatory, not cosmetic: the director turns EVERY\n\
        # endpoint in the primary profile's TargetEndpoints into a routing\n# destination\
        \ and comma-joins them (director.go:486-496), so leaving both in\n# the primary\
        \ profile would dispatch the request to both pods. The joint\n# argmin is\
        \ untouched; only the reporting shape splits.\n- type: causal-slo-externality-picker\n\
        \  parameters:\n    handlerPluginName: causal-slo-externality-handler\n\n\
        schedulingProfiles:\n# ONE ROLE-BLIND PROFILE, and this is the required shape\
        \ rather than a\n# simplification. All profiles receive the same candidateEndpoints\
        \ slice\n# (pkg/epp/scheduling/scheduler.go:81), so an unfiltered profile\
        \ sees BOTH\n# pools -- which is exactly what the joint argmin needs: D local\
        \ candidates\n# plus D*P disaggregated candidates, scored on one scale in\
        \ one argmin.\n#\n# NO SCORERS ARE ATTACHED, and that is deliberate. The arm\
        \ must IGNORE\n# inherited scorer contributions for the same clamping reason\
        \ that forces it\n# to be a picker: a contribution passing through the profile's\
        \ [0,1]\n# score-range enforcement cannot be combined with a signed, unbounded\
        \ J on\n# one scale. Every ScoredEndpoint therefore reaches the picker with\
        \ Score 0,\n# and the picker ignores Score entirely and computes J itself.\n\
        #\n# The handler is NOT referenced here and does not need to be: every\n#\
        \ instantiated plugin is offered to the requestcontrol config\n# (cmd/epp/runner/runner.go:614-640)\
        \ and sorted into hook lists by interface\n# assertion (requestcontrol/request_control_config.go:88-109),\
        \ so its\n# ProfileHandler, PreRequest and ResponseBody hooks are wired by\
        \ its mere\n# presence in `plugins:`.\n- name: default\n  plugins:\n  - pluginRef:\
        \ causal-slo-externality-picker\n"
