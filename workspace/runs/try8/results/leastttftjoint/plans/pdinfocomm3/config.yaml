      pullPolicy: Always
      registry: ghcr.io/kalantar
      repository: llm-d-router
      tag: cee8bb60cbc3-leastttftjoint
    pluginsConfigFile: custom-plugins.yaml
    pluginsCustomConfig:
      custom-plugins.yaml: "apiVersion: llm-d.ai/v1alpha1\nkind: EndpointPickerConfig\n\
        plugins:\n# ===================================================================\n\
        # Inherited producers -- IDENTICAL to the baseline's AND to the focal\n# arm's,\
        \ restated because this string replaces the baseline's wholesale.\n# ===================================================================\n\
        # THE PRODUCER NAMES MUST MATCH THE FOCAL ARM'S EXACTLY. A data key's\n# identity\
        \ is \"<DataType>/<ProducerName>\"\n# (pkg/epp/framework/interface/plugin/datakey.go:45-49),\
        \ so an arm bound to a\n# differently-named producer reads a DIFFERENT signal\
        \ -- and then the two\n# arms are pricing different prompts and different\
        \ prefixes, which\n# confounds the comparison they exist to make. config.md\
        \ \xA75 signal 11\n# states that requirement for a_p; it applies equally to\
        \ a_r.\n#\n# a_r, config.md \xA75 signal 10. BUILT: tokenizer sidecar + this\
        \ plugin.\n# Read as `request.Body.TokenizedPrompt.TokenCount()`; the field\
        \ is a\n# NULLABLE pointer and absence is a real runtime state (degradation\
        \ D8).\n# On absence THIS ARM COMPUTES NOTHING and the choice falls back to\
        \ a THIRD\n# policy -- neither arm -- so the per-arm D8 counter must be compared\
        \ between\n# the arms before any result is read.\n- type: token-producer\n\
        \  parameters:\n    # meta-llama/Llama-3.3-70B-Instruct is expanded by llm-d-benchmark\
        \ at render time; passed\n    # through verbatim rather than substituted here.\n\
        \    modelName: meta-llama/Llama-3.3-70B-Instruct\n    vllm:\n      # The\
        \ loopback render sidecar in the EPP pod, enabled by the\n      # `tokenizer-sidecar`\
        \ defaults fragment. config.md \xA711: with nothing\n      # serving :8000\
        \ the failure is SILENT -- a_r reads 0, every prompt\n      # looks shorter\
        \ than any threshold, and no disaggregation is ever\n      # chosen.\n   \
        \   url: \"http://localhost:8000\"\n# a_p, config.md \xA75 signal 11. Publishes\
        \ PrefixCacheMatchInfo as a\n# per-endpoint attribute; the arm binds it BY\
        \ PRODUCER NAME below.\n- type: approx-prefix-cache-producer\n\n# ===================================================================\n\
        # THE ARM -- TWO REGISTRATIONS SHARING ONE STATE OBJECT\n# ===================================================================\n\
        # NOT one plugin with two interfaces. `ProfileHandler.Pick` and\n# `Picker.Pick`\
        \ share a method name with different signatures\n# (pkg/epp/framework/interface/scheduling/plugins.go:47,\
        \ :77), so no single\n# Go type can satisfy both. The split is forced by the\
        \ target's interface\n# set, not chosen:\n#\n#   least-ttft-joint-handler\
        \  ProfileHandler + PreRequest +\n#                             ResponseBodyProcessor\n\
        #   least-ttft-joint-picker   Filter + Picker\n#\n# THEY ARE THE SAME Go TYPES\
        \ THE FOCAL ARM USES, constructed against a\n# different objective. That is\
        \ how the verbatim-copy contract of\n# config.md \xA79.3 is satisfied -- by\
        \ SHARING one implementation rather than by\n# maintaining two copies of forty\
        \ symbols, which is strictly stronger,\n# because a copy can drift under an\
        \ edit to one side and drift is exactly the\n# failure the contract names.\n\
        #\n# ONLY ONE ARM CAN BE INSTANTIATED PER EPP. Exactly one ProfileHandler\
        \ is\n# permitted across all instantiated plugins\n# (pkg/epp/config/loader/configloader.go:382-391\
        \ errors with \"multiple\n# profile handlers found\"), so this config must\
        \ NOT also declare\n# causal-slo-externality-handler, disagg-profile-handler,\
        \ or\n# single-profile-handler. Both arms are registered in the image; the\
        \ arm is\n# selected by which types THIS FILE names, and one assemble is run\
        \ per arm.\n#\n# A PICKER, NOT A SCORER, for two independent reasons -- the\
        \ second of which\n# is this arm's own rather than inherited:\n#   - a scorer\
        \ returns a per-endpoint map and has NO WAY TO NAME A PAIR,\n#     while the\
        \ objective is over (decode endpoint, prefill placement);\n#   - every scorer\
        \ contribution passes through the profile's score-range\n#     enforcement,\
        \ which CLAMPS to [0,1]\n#     (pkg/epp/scheduling/scheduler_profile.go:212,\
        \ :364). This arm's\n#     objective is a LATENCY IN MICROSECONDS -- non-negative\
        \ and unbounded\n#     above -- so clamping would collapse essentially every\
        \ candidate to a\n#     single score. The focal arm faces the same hazard\
        \ because its J is\n#     signed and unbounded. A picker's own objective does\
        \ not pass through\n#     the clamp.\n#\n# A Filter is required, not incidental:\
        \ `Picker.Pick(ctx, []*ScoredEndpoint)`\n# receives NO REQUEST, so the arriving\
        \ request's token count reaches the\n# argmin no other way. There is no CycleState\
        \ at this pin, so the Filter\n# hands the request-derived operands to the\
        \ Picker by `Endpoint.Put` on the\n# per-request endpoint clones the director\
        \ builds fresh for every cycle,\n# which the Picker reads back with `Get`.\n\
        - type: least-ttft-joint-handler\n  parameters:\n    # -----------------------------------------------------------------\n\
        \    # WHAT IS ABSENT HERE, AND WHY IT IS ABSENT RATHER THAN ZEROED\n    #\
        \ -----------------------------------------------------------------\n    #\
        \ `v`               -- this objective is a raw latency, not a weighted\n \
        \   #                      composite, so there is no multiplier to carry.\n\
        \    # `activeWorkload`  -- and `workloadTargets`. NO tau REACHES THIS ARM\n\
        \    # `workloadTargets`    ANYWHERE. It has no value kernel, no SLO virtual\n\
        \    #                      queues, and no externality over residents, so\
        \ the\n    #                      tau selector of config.md \xA76 is IRRELEVANT\
        \ to it.\n    #                      Note this arm CANNOT be flattened by\
        \ a zero triple\n    #                      the way the focal arm can, because\
        \ it never reads\n    #                      one -- the failure mode the focal\
        \ arm's validation\n    #                      guards against does not exist\
        \ here.\n    # `ablation`        -- every switch in it names a term this arm\
        \ does not\n    #                      have. In particular there is NO `decomposed`\n\
        \    #                      switch: config.md \xA710's knob is\n    #    \
        \                  `DecomposedSLOExternality`, a focal-arm switch,\n    #\
        \                      and this arm's enumeration is plain ascending-ID\n\
        \    #                      order rather than scorer-first, so restricting\
        \ it\n    #                      to the scorer's pick would not reproduce\
        \ a\n    #                      decomposition. The +0.0485 decode-first check\n\
        \    #                      belongs to the focal arm.\n    # `capacity`  \
        \      -- there is no capacity account.\n    #\n    # Setting any of them\
        \ is a STARTUP ERROR, by design. See this file's\n    # header.\n\n    # -----------------------------------------------------------------\n\
        \    # Engine agreement -- config.md \xA75 signals 22, 23, 24 and \xA71\n\
        \    # -----------------------------------------------------------------\n\
        \    # IDENTICAL TO THE FOCAL ARM'S. These are facts about the deployed\n\
        \    # engine, not policy, so a difference between the arms would mean one\
        \ of\n    # them is wrong about the engine it is scheduling onto.\n    engine:\n\
        \      # = max_num_batched_tokens. Sets the prefill chunk budget, so\n   \
        \   # nChunks = ceil(a_p / min(a_p, 32768)) on every candidate.\n      chunkTokens:\
        \ 32768\n      # = block_size. VALIDATED against the scraped Metrics.CacheBlockSize\n\
        \      # per endpoint, and a disagreement REJECTS the endpoint loudly: the\n\
        \      # admission test compares blocks accumulated in one unit against a\n\
        \      # need expressed in another, so a silent unit mismatch is a latent\
        \ bug\n      # rather than an approximation.\n      blockSize: 16\n      #\
        \ = max_num_seqs. No metric exposes it, so it is config: the\n      # rollforward\
        \ estimator needs the batch ceiling to know whether a slot\n      # is free\
        \ at all.\n      maxBatchSize: 256\n\n    # -----------------------------------------------------------------\n\
        \    # Signal bindings -- config.md \xA75 signals 8, 10, 11\n    # -----------------------------------------------------------------\n\
        \    signals:\n      # theta is keyed by THIS POD LABEL, not by the scenario's\n\
        \      # acceleratorType (config.md \xA72, \xA75 signal 8). An absent or unmapped\n\
        \      # value REJECTS the endpoint and counts the rejection; it is never\n\
        \      # defaulted, because heterogeneity rides the per-iteration intercept\n\
        \      # -- 25563.82 us on A100 against 16613.54 us on H100, a factor of\n\
        \      # 1.539 present on EVERY iteration regardless of KV state -- so a\n\
        \      # defaulted label is wrong on every decision rather than only under\n\
        \      # load.\n      gpuTypeLabelKey: pd-infocomm.io/gpu-type\n      # BOUND\
        \ BY PRODUCER NAME, and it must be the SAME NAME the focal arm\n      # binds.\
        \ An empty value would leave the data key at its type-string\n      # default;\
        \ if the operator declared the producer under any other\n      # instance\
        \ name the required key looks unproduced and a SECOND,\n      # nil-parameter\
        \ producer is auto-created and read instead -- two\n      # indexers with\
        \ two block sizes, and possibly the two arms bound to\n      # different prefix\
        \ signals.\n      prefixMatchInfoProducerName: approx-prefix-cache-producer\n\
        \      # Same requirement, and the more dangerous of the two: with nil\n \
        \     # parameters the tokenizer falls through to the `estimate` backend,\n\
        \      # which does not tokenize -- it packs raw request bytes into\n    \
        \  # pseudo-tokens at 4 bytes each. a_r becomes a byte-count heuristic,\n\
        \      # TokenizedPrompt is NON-NIL, and the D8 counter stays at zero because\n\
        \      # nothing is absent. Every candidate is then priced on a wrong prompt\n\
        \      # length with no observable signal.\n      tokenizedPromptProducerName:\
        \ token-producer\n\n    # -----------------------------------------------------------------\n\
        \    # The admission estimator -- DEGRADATION D1, config.md \xA75 signal 28\n\
        \    # -----------------------------------------------------------------\n\
        \    # `rollforward` is the SUBSTITUTE for the scheduler-rollout TTFT model\n\
        \    # that produced every number in sim_results/. The rollout needs the\n\
        \    # engine's ordered wait queue, its current grants, and its step start\n\
        \    # instant; the target exposes Metrics.WaitingQueueSize, one integer.\
        \ Every\n    # call is counted (causal_slo_externality_estimator_substitution_total,\n\
        \    # labelled by plugin_name and plugin_type), because the fallback is\n\
        \    # acceptable and the silence would be the defect.\n    #\n    # D1'S\
        \ DIRECTION IS NOT A SINGLE SIGN FOR THIS ARM, and the focal arm's\n    #\
        \ one-line summary must not be carried over. The two placements join\n   \
        \ # their clocks differently -- local ADDS decode admission with slope 1,\n\
        \    # while disaggregated takes max(remoteLead, tAdmD) -- so understating\n\
        \    # DECODE admission either cancels (when tAdmD dominates the max, it is\n\
        \    # charged identically to both placements) or biases toward LOCAL (when\n\
        \    # remoteLead dominates, the disaggregated candidate is insensitive to\n\
        \    # tAdmD, so only the local candidate gets cheaper). The toward-remote\n\
        \    # direction survives only through the PREFILL admission channel. The\
        \ net\n    # is load- and pool-dependent.\n    #\n    # CONSEQUENCE FOR READING\
        \ RESULTS: treat the arm-vs-arm comparison as\n    # fair only where the substitution\
        \ counter shows the SAME ESTIMATOR\n    # REGIME on both arms. Under decode-side\
        \ congestion -- the regime the\n    # high-load and burst cohorts target --\
        \ D1 shifts the two arms'\n    # local/remote splits by different amounts.\n\
        \    admissionEstimator: rollforward\n\n    # -----------------------------------------------------------------\n\
        \    # Transfer model -- DEGRADATION D5, config.md \xA77. UNMEASURED.\n  \
        \  # -----------------------------------------------------------------\n \
        \   # IDENTICAL VALUES TO THE FOCAL ARM'S, necessarily: a different transfer\n\
        \    # price between the arms would move their local/remote boundaries\n \
        \   # differently and the comparison would measure the difference in c_xfer\n\
        \    # rather than the difference in objective.\n    #\n    # D5 MATTERS MORE\
        \ HERE THAN IN THE FOCAL ARM. There is no externality\n    # term to partially\
        \ offset a mis-priced transfer, so an unmeasured c_xfer\n    # moves this\
        \ arm's decisions systematically. It enters at exactly one\n    # place, the\
        \ remote lead.\n    #\n    # It is NOT the only size-dependent price of going\
        \ remote: the\n    # disaggregated projection also adds the re-timed B+1 first\
        \ decode\n    # iteration, whose KV component scales with the request's own\
        \ input\n    # length, so prompt size prices the remote path through TWO channels.\n\
        \    transfer:\n      sizeAware: true            # config.md \xA79.1\n   \
        \   xferBaseUs: 50.0           # simulator value -- UNMEASURED on target\n\
        \      xferBandwidthGbps: 25.0    # simulator value -- UNMEASURED on target\n\
        \      # Derived arithmetic, not measured: 81920 B per token per GPU\n   \
        \   # (config.md \xA75 signal 27). Leaving it 0 would make transferBytes 0,\
        \ so\n      # every request is charged a flat xferBaseUs -- a 4k-token prompt\
        \ should\n      # be charged ~13500 us, roughly 270x under-priced, with the\
        \ error\n      # growing linearly in prompt length.\n      kvBytesPerTokenPerGpu:\
        \ 81920\n      # Read ONLY when sizeAware is false. Carried so the size-aware\
        \ model\n      # can be switched off for a diagnostic without inventing a\
        \ value.\n      flatCXferUs: 5000\n\n    # -----------------------------------------------------------------\n\
        \    # theta per GPU type -- config.md \xA74, keyed by the POD LABEL VALUE\n\
        \    # -----------------------------------------------------------------\n\
        \    # BYTE-FOR-BYTE THE FOCAL ARM'S COEFFICIENTS. If the two arms carried\n\
        \    # different physics constants every measured difference between them\n\
        \    # would be uninterpretable, and no single-arm test would notice.\n  \
        \  #\n    # BOTH SETS ARE PRESENT even though the generated scenario names\
        \ H100 for\n    # both roles: config.md \xA72's capability gap means the A100\
        \ decode pod is\n    # deployed outside the generated scenario or the scenario\
        \ is hand-edited,\n    # and it must carry `pd-infocomm.io/gpu-type: A100_SXM_80GB`\
        \ with its\n    # nodeSelector pinned to matching hardware. With both sets\
        \ here that pod\n    # is priced correctly the moment it carries the label,\
        \ with no\n    # plugin-config change.\n    #\n    # There is deliberately\
        \ NO FALLBACK ENTRY. An unmapped label must already\n    # have caused the\
        \ endpoint to be rejected.\n    #\n    # Each pair's alphaD and alphaP agree\
        \ within 0.03%; validation rejects a\n    # pair diverging by more than 10%,\
        \ which would mean the coefficients were\n    # fit on mismatched hardware\
        \ or regimes.\n    coeffsByGpuType:\n      H100_SXM_80GB:\n        alphaD:\
        \ 16613.537554540144\n        alphaP: 16617.85321583337\n        c0: 5.347316038602452\n\
        \        c1: 0.04761401141756073\n        cPf: 6.144687138665833\n       \
        \ cAttn: 0.00010075247918809842\n      A100_SXM_80GB:\n        alphaD: 25563.819286862163\n\
        \        alphaP: 25568.34953836831\n        c0: 5.945331876073271\n      \
        \  c1: 0.07822809856114352\n        cPf: 9.794219053944662\n        cAttn:\
        \ 0.00015977670754642687\n\n    # -----------------------------------------------------------------\n\
        \    # The shadow table -- config.md \xA75 signals 12-18, degradations D2/D4/D6\n\
        \    # -----------------------------------------------------------------\n\
        \    # STILL REQUIRED ON THIS ARM, and it is worth saying why, because this\n\
        \    # arm reads no resident VALUE. It reads the resident POPULATIONS, in\n\
        \    # three places:\n    #   D4  ResidentPrefillTokens enters both iteration-time\
        \ laws as S_pf, on\n    #       every candidate.\n    #   D2  RunningDecode\
        \ feeds the remaining-steps estimate and the\n    #       rollforward KV walk,\
        \ so StepsDone and KVBlocks are read.\n    #   D6  RunningPrefill feeds the\
        \ prefill remaining-steps estimate.\n    # What it does NOT inherit is D2c,\
        \ the late-first-token bias: no kernel\n    # here reads ArrivalUs, FirstTokenUs,\
        \ or TTFTSet.\n    #\n    # IDENTICAL SETTINGS TO THE FOCAL ARM'S, because\
        \ the table is a view of\n    # the same fleet and a different TTL would give\
        \ the two arms different\n    # resident populations for the same traffic.\n\
        \    #\n    # `epp.replicas: 1` is pinned in the BASELINE overlay, not here:\
        \ two\n    # replicas PARTITION this table (D2), so each would see a fraction\
        \ of the\n    # residents. Pinning it in the baseline is what makes the baseline\
        \ and\n    # both treatments run identical EPP topology.\n    shadowTable:\n\
        \      # A request that terminates without a final chunk would otherwise be\n\
        \      # charged as a resident forever and permanently inflate every estimate\n\
        \      # on its endpoint.\n      entryTtlSeconds: 900\n      sweepIntervalSeconds:\
        \ 30\n      # config.md \xA75 signal 14 caps S_pf at max_num_batched_tokens,\
        \ so this\n      # and engine.chunkTokens are ONE FACT EXPRESSED TWICE and\
        \ validation\n      # requires them to agree: S_pf is what is being prefilled\
        \ in one engine\n      # step, so its cap is the engine's per-step token budget.\n\
        \      residentPrefillTokensCap: 32768\n\n    # -----------------------------------------------------------------\n\
        \    # Post-processing -- config.md \xA75 signal 25\n    # -----------------------------------------------------------------\n\
        \    # The client-visible per-token post-processing latency (streaming\n \
        \   # detokenization), added explicitly to EVERY TTFT projection because it\n\
        \    # sits outside the calibrated theta.\n    #\n    # config.md gives no\
        \ value for it, and 0.0 is the honest statement of\n    # that rather than\
        \ a measurement. For THIS arm it is genuinely\n    # decision-neutral -- the\
        \ objective IS the projected TTFT, so a common\n    # additive constant shifts\
        \ every candidate equally and cannot change the\n    # argmin. That is NOT\
        \ true of the focal arm, where tHat enters a sigmoid.\n    # The value is\
        \ nonetheless kept identical between the arms, because\n    # differing here\
        \ would put the two arms on different clocks for no gain.\n    outputTokenProcessingUs:\
        \ 0.0\n\n# -------------------------------------------------------------------\n\
        # The picker registration -- Filter + Picker, reads the handler's state.\n\
        # -------------------------------------------------------------------\n# Filter\
        \  splits the two pools by role label, REJECTS endpoints whose\n#        \
        \ GPU-type label is absent or unmapped (counting each rejection by\n#    \
        \     reason), and -- because `Picker.Pick` receives no request -- is the\n\
        #         only place the arriving request's operands (a_r, SLO class, the\n\
        #         per-endpoint a_p, the request ID) can be attached for the Picker.\n\
        # Picker  runs the joint argmin over D local plus D*P disaggregated\n#   \
        \      candidates in PLAIN ASCENDING-ID ORDER and returns BOTH picks in\n\
        #         one ProfileRunResult.\n#\n# ASCENDING-ID, NOT SCORER-FIRST, and\
        \ that is this arm's one declared\n# enumeration divergence from the focal\
        \ arm. Upstream's least-ttft branch\n# iterates the decode snapshots directly\
        \ (sim/edpp.go:1456) while the\n# scorer-first reordering is applied only\
        \ in the SLO-externality and\n# causal-VaR branches (sim/edpp.go:2176-2178).\
        \ It is a TIE-BREAK order, so\n# copying the focal arm's would change which\
        \ candidate wins an EXACT tie --\n# silently, and only sometimes.\n#\n# CONSTRUCTION\
        \ ORDER IS CARRIED BY `handlerPluginName`, NOT BY POSITION IN\n# THIS LIST.\
        \ `instantiatePlugins` topologically sorts a plugin DAG before\n# building\
        \ anything (pkg/epp/config/loader/configloader.go:244-250) and\n# dependencies\
        \ are constructed first. The edge comes from the `pluginRef` tag\n# on the\
        \ picker's handlerPluginName field, discovered by reflection\n# (configloader.go:304-336).\
        \ Removing the reference would break STARTUP\n# rather than ordering: both\
        \ plugins would sit at in-degree 0 and their order\n# would come from ranging\
        \ a Go map, so the EPP crashloops on roughly 5 starts\n# out of 6.\n#\n# THE\
        \ NAME MUST BE THIS ARM'S HANDLER. Pointing it at\n# causal-slo-externality-handler\
        \ is REFUSED at startup: both arms are the\n# same Go type, so the binding\
        \ would otherwise succeed and then run the FOCAL\n# objective while every\
        \ log line and every plugin_type metric label reported\n# this arm -- a comparison\
        \ of one arm with itself, reported as a comparison\n# between two.\n- type:\
        \ least-ttft-joint-picker\n  parameters:\n    handlerPluginName: least-ttft-joint-handler\n\
        \nschedulingProfiles:\n# ONE ROLE-BLIND PROFILE, and this is the required\
        \ shape rather than a\n# simplification. All profiles receive the same candidateEndpoints\
        \ slice\n# (pkg/epp/scheduling/scheduler.go:81), so an unfiltered profile\
        \ sees BOTH\n# pools -- which is exactly what the joint argmin needs: D local\
        \ candidates\n# plus D*P disaggregated candidates, scored on one scale in\
        \ one argmin.\n#\n# NO SCORERS ARE ATTACHED, and that is deliberate, for the\
        \ clamping reason\n# above. Every ScoredEndpoint therefore reaches the picker\
        \ with Score 0. For\n# THIS arm that field is doubly irrelevant: it ignores\
        \ Score entirely and,\n# unlike the focal arm, does not even use it as a tie-break\
        \ order.\n#\n# IDENTICAL TO THE FOCAL ARM'S PROFILE SHAPE. The two arms must\
        \ see the same\n# candidate set, so the profile that supplies it cannot differ\
        \ between them.\n#\n# The handler is NOT referenced here and does not need\
        \ to be: every\n# instantiated plugin is offered to the requestcontrol config\
        \ and sorted into\n# hook lists by interface assertion, so its ProfileHandler,\
        \ PreRequest and\n# ResponseBody hooks are wired by its mere presence in `plugins:`.\n\
        - name: default\n  plugins:\n  - pluginRef: least-ttft-joint-picker\n"
    replicas: 1
    volumeMounts: []
    volumes: []
  extraServicePorts:
