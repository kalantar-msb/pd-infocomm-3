      pullPolicy: Always
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: v0.10.0
    pluginsConfigFile: custom-plugins.yaml
    pluginsCustomConfig:
      custom-plugins.yaml: "apiVersion: llm-d.ai/v1alpha1\nkind: EndpointPickerConfig\n\
        plugins:\n# --- Producers: the signals both the baseline and both arms read\
        \ -------\n#\n# DECLARED IN THE BASELINE ON PURPOSE. Both treatment arms read\
        \ a_r\n# (config.md \xA75 signal 10) and a_p (signal 11), and signal 11's\
        \ note is\n# explicit that the prefix signal must be bound BY PRODUCER NAME\
        \ so both\n# arms read ONE signal -- a data key's identity includes its producer\n\
        # name, so an unbound read can silently become a second,\n# differently-configured\
        \ signal. Declaring the producers once here and\n# inheriting them is what\
        \ makes that binding shared rather than\n# per-arm.\n- type: token-producer\n\
        \  parameters:\n    # meta-llama/Llama-3.3-70B-Instruct is expanded by llm-d-benchmark\
        \ at render time; passed\n    # through verbatim rather than substituted here.\n\
        \    modelName: meta-llama/Llama-3.3-70B-Instruct\n    vllm:\n      # The\
        \ loopback render sidecar in the EPP pod, enabled by the\n      # `tokenizer-sidecar`\
        \ defaults fragment (NOT in\n      # transfer.yaml:defaults.disable). config.md\
        \ \xA711: with nothing\n      # serving :8000 the failure is SILENT -- getUserInputLenInTokens\n\
        \      # returns 0 with no error, every prompt reads as shorter than any\n\
        \      # threshold, and no disaggregation is ever chosen. The observable\n\
        \      # signature is thousands of requests and zero prefill selections.\n\
        \      url: \"http://localhost:8000\"\n- type: approx-prefix-cache-producer\n\
        \n# --- The threshold decider --------------------------------------------\n\
        - type: prefix-based-pd-decider\n  parameters:\n    # UNDERIVABLE FROM THIS\
        \ BUNDLE, and stated as a decision rather than\n    # left to a default. The\
        \ simulation arm is named\n    # `llmd_prefix_threshold_workload_tuned` --\
        \ the threshold was tuned\n    # PER WORKLOAD -- and no file in sim_results/,\
        \ config.md, or README.md\n    # records the tuned values. 512 is llm-d's\
        \ own guide value\n    # (llm-d-benchmark config/scenarios/guides/pd-disaggregation.yaml\
        \ and\n    # the disagg profile-handler README example).\n    #\n    # WHY\
        \ IT IS NOT 0: `nonCachedTokens: 0` DISABLES the decider entirely\n    # (the\
        \ disagg README is explicit -- it always returns false), which\n    # would\
        \ silently turn the P/D baseline into a decode-only baseline\n    # while\
        \ still deploying a prefill pod. That is a different arm.\n    #\n    # If\
        \ the tuned per-workload values are recovered upstream, set them\n    # here\
        \ and re-assemble; the baseline number in sim_results/ is not\n    # reproducible\
        \ at an arbitrary threshold, so treat baseline-vs-sim\n    # comparisons as\
        \ unanchored until then. Arm-vs-arm comparisons are\n    # unaffected: both\
        \ treatments replace this decider outright.\n    nonCachedTokens: 512\n\n\
        - type: disagg-profile-handler\n  parameters:\n    deciders:\n      prefill:\
        \ prefix-based-pd-decider\n\n# --- Role filters and load-shaped scorers ------------------------------\n\
        - type: prefill-filter\n- type: decode-filter\n- type: prefix-cache-scorer\n\
        \  parameters:\n    # BOUND BY PRODUCER NAME -- config.md \xA75 signal 11.\
        \ Explicit even\n    # though it matches the producer declared above, so a\
        \ second\n    # producer cannot silently capture this read.\n    prefixMatchInfoProducerName:\
        \ approx-prefix-cache-producer\n- type: queue-scorer\n- type: kv-cache-utilization-scorer\n\
        - type: active-request-scorer\n\nschedulingProfiles:\n# Profile names match\
        \ disagg-profile-handler's defaults (`decode`,\n# `prefill`), so no `profiles:`\
        \ block is needed.\n- name: decode\n  plugins:\n  - pluginRef: decode-filter\n\
        \  - pluginRef: active-request-scorer\n    weight: 2\n  - pluginRef: prefix-cache-scorer\n\
        \    weight: 3\n- name: prefill\n  plugins:\n  - pluginRef: prefill-filter\n\
        \  - pluginRef: prefix-cache-scorer\n    weight: 3\n  - pluginRef: queue-scorer\n\
        \    weight: 2\n  - pluginRef: kv-cache-utilization-scorer\n    weight: 2\n"
    replicas: 1
    volumeMounts: []
    volumes: []
