      - pokprod-b93r39s2
      - pokprod-b93r43s0
      - pokprod-b93r43s1
      - pokprod-b93r43s2
      - pokprod-b93r43s3
      - pokprod-b93r44s0
      - pokprod-b93r44s1
      - pokprod-b93r44s2
    enabled: true
    extraContainerConfig:
      securityContext:
        capabilities:
          add:
          - IPC_LOCK
          - SYS_RAWIO
          - NET_ADMIN
          - NET_RAW
        runAsGroup: 0
        runAsUser: 0
    extraEnvVars:
    - name: UCX_LOG_LEVEL
