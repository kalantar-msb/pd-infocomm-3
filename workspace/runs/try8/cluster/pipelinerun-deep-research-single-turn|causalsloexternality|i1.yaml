      \        custom-plugins.yaml: \"apiVersion: llm-d.ai/v1alpha1\\nkind: EndpointPickerConfig\\\
      n\\\n          plugins:\\n# ===================================================================\\\
      n\\\n          # Inherited producers -- IDENTICAL to the baseline's, restated\
      \ because\\n\\\n          # this string replaces the baseline's wholesale.\\\
      n# ===================================================================\\n\\\n\
      \          # a_r, config.md §5 signal 10. BUILT: tokenizer sidecar + this plugin.\\\
      n\\\n          # Read as `request.Body.TokenizedPrompt.TokenCount()`; the field\
